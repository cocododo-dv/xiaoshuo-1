[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-system"
version = "0.1.0"
description = "Novel writing system P2 L3 implementation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=50,<51",
  "fastapi>=0.135,<1",
  "httpx>=0.26,<1",
  "pydantic>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0.30,<3",
  "tzdata>=2025.2",
  "uvicorn>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  # Starlette's current TestClient backend; avoids the deprecated httpx shim.
  "httpx2>=2.9,<3",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.16,<1"
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Unknown marks / ini keys are errors, not warnings; a test hung past 5 minutes dumps every
# thread's stack (the suite waits on barriers and background workers) instead of silently
# running into the CI job timeout.
addopts = "--strict-markers --strict-config"
faulthandler_timeout = 300
markers = [
  "consistency_validation: blueprint §17 Action B recall/precision tests",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Start with correctness checks. Formatting/style migration can be phased in
# without hiding undefined names or syntax failures in the meantime.
# F401 / F841: unused imports and locals are dead code; an import that exists only so a test can
# monkeypatch it (or for a side effect) carries ``# noqa: F401`` with the reason.
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
