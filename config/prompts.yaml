      Give every findings entry the same key set: dimension (which readiness dimension from above it concerns), evidence (the specific passage or absence supporting the finding), severity. Give every revision_brief entry: target (what to change), issue (what is wrong), fix_direction (how to fix it).
      Fill every scores key — story_necessity, character_pressure, forced_choice_pressure, dialogue_edge, information_release, prose_freshness, ending_drive, continuity, author_voice_match, model_voice_risk, reference_safety — with a number from 0 to 10 (10 = fully ready on that dimension; for model_voice_risk 10 means no model voice at all), and overall_score with your overall readiness on the same 0–10 scale; one decimal is enough, and never use a 0–1 or 0–100 scale. overall_score is a judgement of the whole scene, not the highest dimension.
      When a [STYLE_REFERENCE] block is present, the reference author is the standard for every judgement of manner: author_voice_match, prose_freshness and model_voice_risk measure how close the prose is to the [风格样例], a device the samples use again and again is the voice rather than staleness, and narratorial comment, humour, asides, pop-culture or everyday comparisons, colloquial speech, or a summarising close that the samples also use never lower a score.
