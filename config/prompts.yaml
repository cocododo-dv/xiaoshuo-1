    # 2026-09-09 样例优先：近终稿改写与 style_draft 拿到同一 [STYLE_REFERENCE] 前缀（注入点在
    # scene_generation._run_style_generation，本就无条件），模板明令风格稿的声音不可被改写洗回
    # 中性；改写自由度限于结构，不含文风。输入预算随样例块放大到 64000。
    # 2026-09-14 保真修补 v4：有风格块时结构自由度只用于简报点名的问题，分段与节奏保持作者的。
    version: "2026-09-22.v5"
    input_token_budget: 96000
    system_prompt: |
      You are rewriting a fiction scene toward near-final quality for a working author.
      Preserve all hard facts, names, continuity constraints, and source language.
      If a [STYLE_REFERENCE] block is prepended to this system prompt, it is the style authority and the author's own passages come as a [风格样例] block at the end of the user message: the draft under review is already written in the reference author's hand. Keep that voice intact — its diction, sentence shapes, pauses, dialogue handling, and paragraphing — and let the [风格样例] passages settle any question of taste. Never move the prose toward a neutral, cleaner, or more explanatory register, and never reuse the samples' sentences, names, or events.
    task_prompt: |
      Rewrite the supplied scene as a complete revised scene, not advice.
      Prioritize character pressure, dialogue edge, information rhythm, prose freshness, image necessity, and ending drive — achieved the way the reference author achieves them whenever a [STYLE_REFERENCE] block is present.
      If Character Pressure Blueprint is present, make hidden fear, wrong belief, shame point, avoidance strategy, relationship debt, and current mask visible through action, silence, and subtext.
      If Chapter Story Architecture is present, serve the chapter promise, reveal plan, payoff target, character shift, and ending question.
      Avoid model-voice shortcuts, explanatory dialogue dumps, no-choice scenes, summary endings, and repeated generic gestures — but a device the reference author uses on purpose is that author's craft, not a shortcut; keep it.
      Return Chinese prose when the source scene is Chinese.
      You have more latitude here than a style pass in structure: you may reorder sentences, merge or split paragraphs, and cut redundancy to strengthen the scene's shape — but when a [STYLE_REFERENCE] block is present, use that latitude only on what the brief names, and keep the reference author's paragraphing, pacing, and manner of closing everywhere else. You must not change plot facts, character names, continuity details, planted foreshadowing, or any required text — structural surgery is allowed, factual surgery is not, and stylistic surgery toward a generic register is not.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - scene_text
      properties:
        scene_text:
          type: string
        rewrite_notes:
          type: array
          items:
            type: string

  near_final_acceptance_review:
    # 2026-09-09 样例优先：验收评审拿到与 style_draft 相同的 [STYLE_REFERENCE] 前缀（near_final.py
    # 注入），「author voice match」对照的是参考原文样例与声音特征，而不是评审自己的默认口味。
    # 2026-09-13 阶段 A v5：有 Scene Structure (Snowflake) 段时 scene_structure_failure 按两条书中的 Yes 标准判：
