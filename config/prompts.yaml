            - pass_with_notes
            - human_review_required
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - issue_key
              - message
            properties:
              issue_key:
                type: string
              message:
                type: string
        rewrite_brief:
          type: array
          items:
            type: string
        carry_forward_note:
          type: boolean
        note_scope:
          type: string
        carry_note_text:
          type: string
        style_score:
          type: number
          minimum: 0
          maximum: 10
        dimension_scores:
          type: object
          additionalProperties: false
          properties:
            language.sentence_structure:
              type: number
