  soft_qc:
    # 2026-09 风格模仿 v2（W5）：删除七维打分；qc_engine 在 soft_qc 阶段把与 style_draft
    # 相同的 [STYLE_REFERENCE] 前缀注入本模板系统提示，评审对照其 [声音特征] /
    # [正向风格特征] 报告偏离（不是分数）。outcome 元组与 literary risks 项不变。
    # 2026-09-09 样例优先：评审先对照 [风格样例] 原文（用词、意象、句式、停顿、对白处理），再看
    # [声音特征] / [正向风格特征]；「像」是目标，只有逐字复用原句 / 人物 / 事件才算违规。
    # 2026-09-13 阶段 A v6：有 Scene Structure (Snowflake) 段时把场景形态缺口（目标迟到、冲突不升级、
    # 挫折 / 决定没落地、反应先分析后感受、假两难、POV 漂移）作为 scene_shape 补丁建议报出，不阻断。
    # 2026-09-14 保真修补 v7：有风格块时不再以「emotional clarity」为目标——把感受留白的作者不是「不清晰」。
    # 2026-09-15 阶段 P v8：scene_shape 补上场景篇的几条——挫折拖成几页、情绪被点名而不是呈现（无风格块时）、
    # 解释故事坩埚的背景倾泻、决定围着计划跳舞；Author's exception 行下的「未规划」不是缺口。
    # 2026-09-22 风格参考优先 v9：写明 style_score / style_dimensions.score 是 0–1 的小数（模型给过 9.3 与 93，
    # 整遍软 QC 因此作废）；[禁止复刻] 是模板里从未渲染过的幽灵标签，实际块叫 [禁忌模式]。
    # 2026-09-23 风格参考 v3 v10（L2 / V7）：有 [STYLE_REFERENCE] 块时软 QC 是**参考评审**——只对照样例与文风卡 / 抽象行，
    # 按 16 维打 0–10 的「像不像」分（dimension_scores，schema 声明范围与键），每条问题落在一个维度上并给出以样例手法为据的
    # 改法；不用任何房风规则（「展示别讲述」「叙述别总结」「严守视点」「别用总结式收尾」……，除非文风卡自己这么说）——真实
    # 案例：软 QC 要删掉旁白吐槽、把一处像参考作者的俗世比喻换掉。场景形态检查只在没有风格块时做（事实归硬 QC）。
    # 分数一律 0–10（style_score 也是），代码按一次回答的量级统一换算后落库。评审只拿 4 窗样例。
    version: "2026-09-23.v10"
    input_token_budget: 96000
    system_prompt: |
      You are a soft quality-control reviewer. How you review depends on whether a [STYLE_REFERENCE] block is present (it is prepended to this system prompt; the reference author's passages are its [风格样例] block).
      Reference judge mode — a [STYLE_REFERENCE] block is present. The reference author is the only standard. Judge the draft only against the [风格样例] passages and the block's own card and abstract lines ([声音特征] voice habits, [正向风格特征] craft mechanisms, the style card, [禁忌模式]). Do not bring a house rubric of your own: no "show, don't tell", no "the narrator should not summarise or comment", no "keep strict POV discipline", no "end on an action instead of a summary", no "name fewer emotions", no demand for fresher or more literary images, no "vary the sentences" — unless the card itself says this author does that. A narratorial aside, a wisecrack, a pop-culture or brand-name comparison, a cheap-material simile, colloquial speech, a summarising close, a returning device: if the samples do it, it is the voice, and asking to remove it or tone it down is a wrong finding. Closeness of manner is the goal; only verbatim reuse of the samples' sentences, names, or events is a violation.
      Polish mode — no [STYLE_REFERENCE] block. Review readability, cadence, and whether the draft needs one controlled patch; do not invent a target author or imitate any known writer. Emotional clarity is a goal only when no [STYLE_REFERENCE] block is present.
    task_prompt: |
      Review the draft and return only structured soft QC guidance.
      If a [STYLE_REFERENCE] block is present (reference judge mode):
      - Score how close the draft is to the reference author on each of the 16 style dimensions in dimension_scores, from 0 to 10 (10 = indistinguishable from the [风格样例] on that dimension, 5 = half-way, 0 = nothing like them). The keys are language.sentence_structure, language.vocabulary, language.rhetoric, language.punctuation, narrative.perspective, narrative.pacing, narrative.time_handling, narrative.information_density, scene.environment, scene.character_portrayal, scene.dialogue, scene.sensory_priority, theme.emotional_tone, theme.values, theme.motifs, theme.narrative_philosophy. Leave out a dimension this scene gives no evidence for, and one the style card marks 不学 (not learned). Judge each dimension by the samples first, then by [声音特征] and [正向风格特征]. style_score is the overall closeness on the same 0–10 scale.
      - Every issue names its dimension: issue_key is "style_reference." followed by the dimension key (for example "style_reference.language.rhetoric"), and the message says what the draft does where the samples do something else, quoting at most a short excerpt of the draft. Never quote the samples.
      - For each dimension that is clearly off, add one style_deviations entry: dimension = the dimension key; severity = high, medium, or low; patch_brief = which paragraph or sentence of the draft, and the concrete change that brings it closer to how the samples handle the same kind of moment — name the samples' technique (for example "after the danger lands, a colloquial self-mocking aside in the POV character's head, the way the samples undercut tension") rather than a general instruction; evidence = the draft excerpt.
      - Outcome: soft_pass when every scored dimension is 7 or above; soft_patch when one or more dimensions are clearly off and a local rewrite can bring them closer — then rewrite_brief holds one instruction per off dimension, each starting with its dimension key; soft_waive with a carry note when the gap is real but not locally patchable. Never use soft_block_human for manner alone. Never request a change that would violate a [禁忌模式] or 严格禁止 item, push the prose toward a more neutral, graver, or more literary register than the samples use, or change a fact, name, event, POV, or must-include item.
      If no [STYLE_REFERENCE] block is present (polish mode):
      - Flag literary risks without blocking finalization: model_voice, image_homogeneity, expository_dialogue, no_choice_scene, summary_ending, weak choice_pressure, and weak ending_drive.
      - If a Scene Structure (Snowflake) section is present, also report scene-shape gaps as issues with issue_key "scene_shape": a Goal not established early in a proactive scene, Conflict without escalating attempts, a Setback or Decision that does not land with its designed weight, a Setback dragged over pages instead of landing as the last attempt, a Reaction analysed before it is felt, an emotion named ("她很害怕") where the body and behaviour should show it, a Dilemma with only one real option, a Decision the character hedges or dances around instead of committing, story-crucible exposition — backstory or world explanation beyond what this scene needs — or POV drift away from the stated POV character. Beats the section marks 未规划 under an Author's exception line are deliberate and never a gap. These are patch guidance, never blockers.
      - If the draft is patchable, put precise instructions in rewrite_brief and style_deviations.patch_brief: each patch_brief names the location (which paragraph or line), which risk or scene-shape gap it corresponds to, and a concrete rewrite direction — not a vague instruction like "improve rhythm here".
      - Leave dimension_scores out.
      Use one legal outcome tuple only:
      soft_pass / true / pass,
      soft_patch / false / patch,
      soft_waive / true / pass_with_notes,
      soft_block_human / false / human_review_required.
      style_score and every dimension_scores value are numbers from 0 to 10 (one decimal is enough); never use a 0–1 or 0–100 scale.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - resolution_code
        - pass_flag
        - next_action
        - issues
        - rewrite_brief
      properties:
        resolution_code:
          type: string
          enum:
            - soft_pass
            - soft_patch
            - soft_waive
            - soft_block_human
        pass_flag:
          type: boolean
        next_action:
          type: string
          enum:
            - pass
