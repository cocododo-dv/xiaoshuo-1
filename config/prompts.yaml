      若某条 observation 确实证据不足或不典型,不要输出它;但不要把"不足 3 条"当作安全的默认结果。
      不要为凑数而编造证据,也不要降低"quote 必须是段落原句"的标准;书中具体的招牌意象只登记进 forbidden_patterns,不要写进 observations。
