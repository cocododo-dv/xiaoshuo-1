                pattern: "^S[0-9]{3}$"
              new_text:
                type: string
                minLength: 20
                maxLength: 600

  soft_qc:
    # 2026-09 风格模仿 v2（W5）：删除七维打分；qc_engine 在 soft_qc 阶段把与 style_draft
    # 相同的 [STYLE_REFERENCE] 前缀注入本模板系统提示，评审对照其 [声音特征] /
    # [正向风格特征] 报告偏离（不是分数）。outcome 元组与 literary risks 项不变。
    # 2026-09-09 样例优先：评审先对照 [风格样例] 原文（用词、意象、句式、停顿、对白处理），再看
    # [声音特征] / [正向风格特征]；「像」是目标，只有逐字复用原句 / 人物 / 事件才算违规。
    # 2026-09-13 阶段 A v6：有 Scene Structure (Snowflake) 段时把场景形态缺口（目标迟到、冲突不升级、
    # 挫折 / 决定没落地、反应先分析后感受、假两难、POV 漂移）作为 scene_shape 补丁建议报出，不阻断。
    # 2026-09-14 保真修补 v7：有风格块时不再以「emotional clarity」为目标——把感受留白的作者不是「不清晰」。
    # 2026-09-15 阶段 P v8：scene_shape 补上场景篇的几条——挫折拖成几页、情绪被点名而不是呈现（无风格块时）、
    # 解释故事坩埚的背景倾泻、决定围着计划跳舞；Author's exception 行下的「未规划」不是缺口。
    # 2026-09-22 风格参考优先 v9：写明 style_score / style_dimensions.score 是 0–1 的小数（模型给过 9.3 与 93，
    # 整遍软 QC 因此作废）；[禁止复刻] 是模板里从未渲染过的幽灵标签，实际块叫 [禁忌模式]。
    version: "2026-09-22.v9"
    input_token_budget: 96000
    system_prompt: |
      You are a soft quality-control reviewer for prose polish and style-reference adherence.
      If a [STYLE_REFERENCE] block is present above this instruction, judge the draft first against its [风格样例] passages (the reference author's own prose: diction, imagery, sentence shapes, pauses, dialogue handling) and then against its [声音特征] (voice habits) and [正向风格特征] (positive craft mechanisms) sub-blocks, and report concrete deviations, not scores. Closeness of manner is the goal; only verbatim reuse of the samples' sentences, names, or events is a violation. If no [STYLE_REFERENCE] block is present, skip style-adherence judgement and review polish only.
      Focus on readability, cadence, and whether the draft needs one controlled patch. Emotional clarity is a goal only when no [STYLE_REFERENCE] block is present: a reference author who leaves feeling implicit is not unclear, and a patch must never ask for feelings to be spelled out that the reference would leave unsaid.
    task_prompt: |
      Review the draft for polish opportunities and return only structured soft QC guidance.
      If a [STYLE_REFERENCE] block is present, compare the draft with its [风格样例] first, then with [声音特征] and [正向风格特征]: name concrete deviations in style_deviations — diction and register, image choice, sentence shapes, function-word habits, punctuation rhythm, dialogue-lead placement, sentence-length cadence, paragraphing, information release. Never penalize the draft for sounding like the reference; flag only verbatim reuse of reference sentences, names, or events, and never request a change that would violate a [禁忌模式] or 严格禁止 item or push the prose toward a more neutral register than the reference uses.
      Also flag literary risks without blocking finalization: model_voice, image_homogeneity, expository_dialogue, no_choice_scene, summary_ending, weak choice_pressure, and weak ending_drive.
      If a Scene Structure (Snowflake) section is present, also report scene-shape gaps as issues with issue_key "scene_shape": a Goal not established early in a proactive scene, Conflict without escalating attempts, a Setback or Decision that does not land with its designed weight, a Setback dragged over pages instead of landing as the last attempt, a Reaction analysed before it is felt, an emotion named ("她很害怕") where the body and behaviour should show it (only when no [STYLE_REFERENCE] block is present — a reference author who names feelings is not a gap), a Dilemma with only one real option, a Decision the character hedges or dances around instead of committing, story-crucible exposition — backstory or world explanation beyond what this scene needs — or POV drift away from the stated POV character. Beats the section marks 未规划 under an Author's exception line are deliberate and never a gap. These are patch guidance, never blockers, and when a [STYLE_REFERENCE] block is present judge them in the reference author's manner.
      When a [STYLE_REFERENCE] block is present, flag model_voice, image_homogeneity, summary_ending, and weak ending_drive only where the reference author demonstrably does not do these things: a summary or reflective ending, a returning image, narratorial explanation, or an even pace that matches the [风格样例] is the reference voice, not a risk.
      If style drift is patchable, put precise instructions in rewrite_brief and style_deviations.patch_brief.
      Use one legal outcome tuple only:
      soft_pass / true / pass,
      soft_patch / false / patch,
      soft_waive / true / pass_with_notes,
      soft_block_human / false / human_review_required.
      Each style_deviations entry's patch_brief must name the location (which paragraph or line), which voice habit, positive mechanism, or literary risk above it corresponds to, and a concrete rewrite direction — not a vague instruction like "improve rhythm here".
      style_score and every style_dimensions[].score are decimals between 0 and 1 (1.0 = indistinguishable from the reference author, 0.5 = half-way); never use a 0–10 or 0–100 scale.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - resolution_code
        - pass_flag
        - next_action
        - issues
        - rewrite_brief
      properties:
        resolution_code:
          type: string
          enum:
            - soft_pass
            - soft_patch
            - soft_waive
            - soft_block_human
        pass_flag:
          type: boolean
        next_action:
          type: string
          enum:
            - pass
            - patch
            - pass_with_notes
            - human_review_required
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - issue_key
              - message
            properties:
              issue_key:
                type: string
              message:
                type: string
        rewrite_brief:
          type: array
          items:
            type: string
        carry_forward_note:
          type: boolean
        note_scope:
          type: string
        carry_note_text:
          type: string
        style_score:
          type: number
        style_dimensions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - score
              - evidence
            properties:
              name:
                type: string
              score:
                type: number
              evidence:
                type: string
        style_deviations:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - dimension
              - severity
              - patch_brief
            properties:
              dimension:
                type: string
              severity:
                type: string
              patch_brief:
                type: string
              evidence:
                type: string

