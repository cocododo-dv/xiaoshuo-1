  style_ref_paragraph_classify_anchor:
    version: "2026-07-04.v2"
    input_token_budget: 2400
    system_prompt: |
      你是中文叙事段落分类专家。给定一批段落,逐段判断其类型,从 8 类中严格选择一个:
      dialogue / narration / psychology / description_env / description_char / action / transition / flashback。
      判断原则见 task_prompt。本任务是锚定集的强模型分类,作为后续快模型校准的基准。
    task_prompt: |
      8 类定义:
        1. dialogue          含明确引号或"……说""……道"
        2. narration         全知视角推进剧情的散文体段落
        3. psychology        内心活动、回忆、内省(典型词:想着/觉得/暗忖/恍惚)
        4. description_env   刻画场所、天气、自然或物件
        5. description_char  刻画外貌、衣着、神态
        6. action            连续动作动词
        7. transition        场景切换/时间跳跃句(通常短)
        8. flashback         对过去事件的追述(典型词:记得/那年/从前)
      规则:一段只归一类,多种特征以主导(>50%)为准;含直接引语优先 dialogue;短段(<30 字)且无对话/心理标识默认 transition。
      边界判例(常见混淆,按此裁决):
        - 对白夹叙述:看该段主要在推进什么——核心是动作/场景变化判 narration 或 action,核心是人物开口说话判 dialogue。
        - 诗句/歌谣等韵文插入:用于渲染环境氛围判 description_env,是人物内心吟诵/回忆的一部分判 psychology,不要另立新类别。
        - 书信体/日记体段落:第一人称自述背景或情感判 psychology,只是转述信件里的事件经过判 narration。
      仅看当前段本身,不考虑上下文。
      完整性要求:输入给你的每一个 paragraph_index 都必须在 classifications 里出现恰好一次,不得跳过、不得合并、不得新增不存在的 index。
      输出 JSON: { "classifications": [ {"paragraph_index": int, "paragraph_type": str, "confidence": "high"|"medium"|"low"}, ... ] }
    structured_schema: &paragraph_classify_schema
      type: object
      additionalProperties: false
      required:
        - classifications
      properties:
        classifications:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - paragraph_index
              - paragraph_type
              - confidence
            properties:
              paragraph_index:
                type: integer
              paragraph_type:
                type: string
                enum:
                  - dialogue
                  - narration
                  - psychology
                  - description_env
                  - description_char
                  - action
                  - transition
                  - flashback
              confidence:
                type: string
                enum: [high, medium, low]

  style_ref_paragraph_classify_bulk:
    version: "2026-07-04.v2"
    input_token_budget: 2400
    system_prompt: |
      你是中文叙事段落分类专家。给定一批段落,逐段判断其类型,从 8 类中严格选择一个:
      dialogue / narration / psychology / description_env / description_char / action / transition / flashback。
      本任务是 bulk 路径的快模型分类,在锚定集 agreement ≥ 0.85 时启用。
    task_prompt: |
      8 类定义:
        1. dialogue          含明确引号或"……说""……道"
        2. narration         全知视角推进剧情的散文体段落
        3. psychology        内心活动、回忆、内省(典型词:想着/觉得/暗忖/恍惚)
        4. description_env   刻画场所、天气、自然或物件
        5. description_char  刻画外貌、衣着、神态
        6. action            连续动作动词
        7. transition        场景切换/时间跳跃句(通常短)
        8. flashback         对过去事件的追述(典型词:记得/那年/从前)
      规则:一段只归一类,多种特征以主导(>50%)为准;含直接引语优先 dialogue;短段(<30 字)且无对话/心理标识默认 transition。
      边界判例:对白夹叙述看"主要推进什么"(动作/场景变化判 narration 或 action,人物开口判 dialogue);诗句渲染环境判 description_env、人物内心吟诵判 psychology;书信体自述背景判 psychology、转述事件判 narration。
      仅看当前段本身,不考虑上下文。
      完整性要求:输入给你的每一个 paragraph_index 都必须在 classifications 里出现恰好一次,不得跳过、不得合并、不得新增不存在的 index。
      输出 JSON: { "classifications": [ {"paragraph_index": int, "paragraph_type": str, "confidence": "high"|"medium"|"low"}, ... ] }
    structured_schema: *paragraph_classify_schema

  style_ref_extract_language:
    version: "2026-08-19.v5"
    input_token_budget: 3000
    system_prompt: |
      你是中文叙事风格抽取专家。给定一个 sub_dimension(如 language.rhetoric)
      与一批段落,产出该 sub_dimension 下的:
        - observations(正向特征,通常 3-6 条;样本确实高度匮乏时可以更少,但 0 条应是罕见例外而非默认结果)
        - forbidden_patterns(反向禁忌,0-2 条,允许为空)
      下列硬指标已对全文计算完毕,你提取的 observation 必须与之一致;
      若你的描述与硬指标矛盾,以硬指标为准重新组织语言。
      约束:
      - 每条 observation / forbidden_pattern 必须 ≥ 2 evidence;每条 evidence 引用
        paragraph_id + span + 原文 quote(quote 必须是段落原句,不允许改写)
      - 每条 evidence.quote 必须是某一个给定 paragraphs[].text 中单段、连续、逐字一致的
        子串,paragraph_id 必须原样复制该段 ID。严禁拼接不相邻短语、摘要式删节或自行增删
        标点;原文没有省略号时,quote 中也不得添加“……”或"..."。若填写 span,它必须是
        给定 text 上从 0 开始、左闭右开的 [start,end),且 text[start:end] 必须等于 quote
      - 严禁使用空泛形容词(如"文笔优美""画面感强""叙事流畅"等),要用具体、可
        被验证的写作机制描述
      - statement 只写可迁移的抽象机制,不得引用、复述或举例展示参考原文;
        任何原文字词只允许出现在 evidence.quote
      - 每条 quote 只截取足以证明机制的一小段连续原文,建议 15-80 字、绝不超过 160 字;
        statement 不超过 120 字。不要输出 note,illustrates_dims 等非必需可选字段
      - forbidden_pattern 描述作者明确不会用的写作模式(反向写作习惯);evidence 可以是
        paragraph_quote / author_avoidance(统计反推)/ counter_example(LLM 合成反例)
    task_prompt: |
      输入 payload 含 sub_dimension / metrics_anchor / paragraphs。
      请按 schema 输出 observations 与 forbidden_patterns。
      句法节奏、词汇质感、修辞、对白语言这类特征在给定的段落量下几乎总能找到,请逐段认真比对后再判断是否"找不到"。
      若某条 observation 确实证据不足或不典型,不要输出它;但不要把"不足 3 条"当作安全的默认结果,那通常说明分析还不够仔细。
      不要为凑数而编造证据,也不要降低"quote 必须是段落原句"的标准。
    structured_schema: &extract_output_schema
      type: object
      additionalProperties: false
      required:
        - observations
        - forbidden_patterns
      properties:
        observations:
          type: array
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [statement, finding_kind, evidence, sub_dimension]
            properties:
              statement:
                type: string
                maxLength: 180
              confidence:
                type: string
                enum: [high, medium, low]
              finding_kind:
                type: string
                enum: [observation]
              sub_dimension:
                type: string
              evidence:
                type: array
                minItems: 2
                items: &extract_evidence_schema
                  type: object
                  additionalProperties: false
                  required: [quote]
                  properties:
                    paragraph_id:
                      type: string
                    span:
                      type: array
                      items: {type: integer}
                      minItems: 2
                      maxItems: 2
                    quote:
                      type: string
                      maxLength: 160
                    illustrates_dims:
                      type: array
                      items: {type: string}
                    anchor_kind:
                      type: string
                      enum: [paragraph_quote, author_avoidance, counter_example]
                    note:
                      type: string
                    is_synthetic:
                      type: integer
        forbidden_patterns:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [statement, finding_kind, evidence, sub_dimension]
            properties:
              statement: {type: string, maxLength: 180}
              confidence:
                type: string
                enum: [high, medium, low]
              finding_kind:
                type: string
                enum: [forbidden_pattern]
              sub_dimension: {type: string}
              evidence:
                type: array
                minItems: 2
                items: *extract_evidence_schema

  style_ref_extract_narrative:
    version: "2026-08-19.v5"
    input_token_budget: 3000
    system_prompt: |
      你是中文叙事风格抽取专家(叙事层)。给定一个 sub_dimension(如
      narrative.pacing)与一批段落,产出该 sub_dimension 下的
      observations(正向特征,通常 3-6 条;样本确实高度匮乏时可以更少,但 0 条应是罕见例外而非默认结果)
      与 forbidden_patterns(反向禁忌,0-2 条,允许为空)。
      约束与 style_ref_extract_language 一致;尤其注意叙事层关心视角(perspective)、
      节奏(pacing)、时间处理(time_handling)、信息密度(information_density)。
      叙事层容易写成"张弛有度"式的空泛结论——每条 observation 必须绑定一个具体、可指认的
      叙事决策点(如在哪一类节点切换视点、在哪种场景压缩或拉长时间、信息在何时释放给读者),
      而不是笼统描述整体印象。
      每条 evidence.quote 必须是某一个给定 paragraphs[].text 中单段、连续、逐字一致的子串,
      paragraph_id 原样复制该段 ID;严禁拼接不相邻短语或添加原文没有的省略号。若填写 span,
