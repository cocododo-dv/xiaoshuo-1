  style_ref_paragraph_classify_anchor:
    version: "2026-09-23.v3"
    input_token_budget: 6000
    system_prompt: |
      你是中文叙事段落分类专家。给定一批按原书顺序排列的段落,逐段判断其类型,从 8 类中严格选择一个:
      dialogue / narration / psychology / description_env / description_char / action / transition / flashback。
      判断原则见 task_prompt。本任务是锚定集(从全书各处均匀抽出的段落)的分类,作为全书分类的基准。
    task_prompt: |
      8 类定义(每段只归一类,多种特征并存时按占主导(>50%)的那一种判):
        1. dialogue          人物直接说出口的话是这段的主体(引号里的对白,或以「说 / 道 / 问」引出的直接引语)
        2. narration         叙述者交代事件、推进情节、概述经过的段落
        3. psychology        人物的内心活动:想法、感受、判断、犹豫、内省(想着 / 觉得 / 心里 / 暗忖 …)
        4. description_env   刻画场所、天气、自然景物、物件
        5. description_char  刻画人物的外貌、衣着、神态、姿态
        6. action            以连续的具体动作推进的段落
        7. transition        场景切换、时间跳跃、章节标题、分隔标记
        8. flashback         对过去事件的追述(记得 / 那年 / 从前 …)
      判断规则:
        - 段落长短不决定类型:短段也按内容判——一句短的动作判 action,一句短的心里话判 psychology,
          一句短的交代判 narration,一句短的对白判 dialogue;只有真正在切换场景 / 时间 / 章节的段才判 transition。
        - 含直接引语、且对白是这段的主体时判 dialogue;引号只是引用一个词、称呼、书名或念头时不算对白。
        - 对白夹叙述:看这段主要在推进什么——核心是动作 / 场景变化判 action 或 narration,核心是人物开口判 dialogue。
        - 诗句 / 歌谣等韵文插入:渲染环境判 description_env,是人物内心吟诵 / 回忆的一部分判 psychology。
        - 书信体 / 日记体:第一人称自述心境判 psychology,转述事件经过判 narration。
      上下文(只读,帮助理解,不要分类):
        - paragraphs 按原书顺序给出;相邻的 paragraph_index 在原书里也相邻。
        - context_before / context_after 是这一段在原书里的前一段 / 后一段(只在它们不在本批里时给出),
          用来判断这段在前后文里起什么作用;不要为它们输出分类。
      完整性要求:输入给你的每一个 paragraph_index 都必须在 classifications 里出现恰好一次,原样照抄,
      不得跳过、不得合并、不得新增不存在的 index;paragraph_type 只能是上面 8 个英文值之一。
      输出 JSON: { "classifications": [ {"paragraph_index": int, "paragraph_type": str, "confidence": "high"|"medium"|"low"}, ... ] }
    structured_schema: &paragraph_classify_schema
      type: object
      additionalProperties: false
      required:
        - classifications
      properties:
        classifications:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - paragraph_index
              - paragraph_type
              - confidence
            properties:
              paragraph_index:
                type: integer
              paragraph_type:
                type: string
                enum:
                  - dialogue
                  - narration
                  - psychology
                  - description_env
                  - description_char
                  - action
                  - transition
                  - flashback
              confidence:
                type: string
                enum: [high, medium, low]

  style_ref_paragraph_classify_bulk:
    version: "2026-09-23.v3"
    input_token_budget: 6000
    system_prompt: |
      你是中文叙事段落分类专家。给定一批按原书顺序排列的段落,逐段判断其类型,从 8 类中严格选择一个:
      dialogue / narration / psychology / description_env / description_char / action / transition / flashback。
      判断原则见 task_prompt。本任务是全书余下段落的分类。
    task_prompt: |
      8 类定义(每段只归一类,多种特征并存时按占主导(>50%)的那一种判):
        1. dialogue          人物直接说出口的话是这段的主体(引号里的对白,或以「说 / 道 / 问」引出的直接引语)
        2. narration         叙述者交代事件、推进情节、概述经过的段落
        3. psychology        人物的内心活动:想法、感受、判断、犹豫、内省(想着 / 觉得 / 心里 / 暗忖 …)
        4. description_env   刻画场所、天气、自然景物、物件
        5. description_char  刻画人物的外貌、衣着、神态、姿态
        6. action            以连续的具体动作推进的段落
        7. transition        场景切换、时间跳跃、章节标题、分隔标记
        8. flashback         对过去事件的追述(记得 / 那年 / 从前 …)
      判断规则:
        - 段落长短不决定类型:短段也按内容判——一句短的动作判 action,一句短的心里话判 psychology,
          一句短的交代判 narration,一句短的对白判 dialogue;只有真正在切换场景 / 时间 / 章节的段才判 transition。
        - 含直接引语、且对白是这段的主体时判 dialogue;引号只是引用一个词、称呼、书名或念头时不算对白。
        - 对白夹叙述:看这段主要在推进什么——核心是动作 / 场景变化判 action 或 narration,核心是人物开口判 dialogue。
        - 诗句 / 歌谣等韵文插入:渲染环境判 description_env,是人物内心吟诵 / 回忆的一部分判 psychology。
        - 书信体 / 日记体:第一人称自述心境判 psychology,转述事件经过判 narration。
      上下文(只读,帮助理解,不要分类):
        - paragraphs 按原书顺序给出;相邻的 paragraph_index 在原书里也相邻。
        - context_before / context_after 是这一段在原书里的前一段 / 后一段(只在它们不在本批里时给出),
          用来判断这段在前后文里起什么作用;不要为它们输出分类。
      完整性要求:输入给你的每一个 paragraph_index 都必须在 classifications 里出现恰好一次,原样照抄,
      不得跳过、不得合并、不得新增不存在的 index;paragraph_type 只能是上面 8 个英文值之一。
      输出 JSON: { "classifications": [ {"paragraph_index": int, "paragraph_type": str, "confidence": "high"|"medium"|"low"}, ... ] }
    structured_schema: *paragraph_classify_schema

  # 2026-09-23 风格参考 v3 学习作业(learn_job):四层各一次调用,读同一组约 12 窗 / 4 万字的连续原文
  # (learn_select 挑的抽取窗口集,每段前标【p】)。input_token_budget 是真执行的上限:learn_llm.payload_fits
  # 按与发送时同一种渲染估计(CJK 一字一 token 的上界 ×1.1 + schema),装不下时按窗整窗卸载(至少留 3 窗)。
  # 实测(2026-09-23,一本 190 万字的真实参考书):抽取集 11 窗 / 41,000 字,渲染后用户消息 ≈4.73 万字符,
  # 按上面的口径估 4.84 万 token → 预算 64000,留约四分之一余量(整窗卸载只在更长的窗口 / 更大的书上才会发生)。
  style_ref_extract_language:
    version: "2026-09-23.v6"
    input_token_budget: 64000
    system_prompt: &learn_extract_system |
      你是中文小说文风研究者。下面是一位作者的原文样本:从全书各处挑出的一组连续片段(章首、章末、对白多的、叙述多的、
      写心理的、写动作的都有)。你的任务是把这位作者**和通用大模型写法不一样的地方**逐维写清楚——之后系统会据此让写作
      模型**全面模仿**这位作者的手笔写新故事,所以越具体越好:作者自己的用词、口头禅、句末语气词、比喻从哪里取材、
      句子怎么断、幽默从哪里来、紧张时怎么写,都要抓。

      每一维要给:
        - model_default:一句话(≤60 字),通用大模型写这一维时的默认做法。例如「比喻多取自然景物,爱用仿佛、宛如」
          「对白规整,一问一答,不带口头禅」「紧张时堆形容词,很少给具体数字」。写准它,写作者才知道要「代替」什么。
        - observations:≤5 条,这位作者在这一维的具体做法,按辨识度从高到低。每条写成可以照着做、能在原文里指认的
          做法(不是鉴赏);可以用「」引作者的原词作例子,每处 ≤10 字,但不要整句照抄。
        - avoid:≤2 条,这位作者明显**不这么写**的地方,写成「不……,而是……」的对照;证据是作者**实际怎么写**的原文。
        - devices:≤3 个手法名,每个 ≤8 字,给这位作者的招牌手法起个短名(例如「降维比喻」「心里吐槽」「数字倒计时」
          「亚文化梗」),之后用来给全书片段打标签。
        - distinctiveness:0 到 1,这一维上作者和通用写法差得有多远(越独特越高)。

      证据规则(最重要,系统会逐字核对,对不上的整条丢弃):
        - 每条 observation / avoid 给 2 到 4 条 evidence;每条 evidence 是 {p: 段号, quote: 引文}。
        - p 是样本里【p】标出的数字;quote 必须是**那一段**里连续、逐字一致的一小段(4 到 60 字):不改字、不增删标点、
          不拼接两处、不加省略号。
        - 两条 evidence 尽量来自不同片段。

      不要写:
        - 空泛评价(文笔优美、画面感强、节奏流畅、情感真挚之类);
        - 统计数字(平均句长多少字、占百分之几)——可测的量由系统另外精确计算;
        - 本书的人名、地名、组织、专有物件与设定名——那些归「本书专名」,陈述里用「主角」「同伴」「某组织」「古老兵器」
          这类代称;
        - 情节复述。
      只输出 schema 规定的 JSON。
    task_prompt: |
      本次分析「语言层」的 4 个维度(dimension 用英文键):
        - language.sentence_structure 句式结构:长句怎么铺、短句落在哪里、分句怎么连、句子怎么起头收尾、有没有独句成段、
          叙述里夹不夹问句;
        - language.vocabulary 词汇选择:口语、俚语、网络与圈子用语、流行文化 / 游戏 / 影视 / 消费品名、专业术语、文白比例,
          作者自己的口头禅与句末语气词(吧、呢、啊、嘛……);
        - language.rhetoric 修辞手法:比喻的喻体从哪里取(日常物件、影视游戏、动物、机器……)、夸张与「降格」(把宏大的
          比作琐碎的)、反差造成的幽默、排比、设问与反问;
        - language.punctuation 标点节奏:问号、叹号、省略号、破折号用在什么场合,逗号把句子切得多碎。
      样本见数据块:windows 里每个片段带 window(片段号)、chapter(第几章)、position(章首 / 章末 / 章中 / 整章)、
      text(每段以【p】开头)。4 个维度都要输出;某维确实找不到可靠证据时 observations 给空数组、distinctiveness 设低。
    structured_schema: &learn_extract_schema
      type: object
      additionalProperties: false
      required: [dimensions]
      properties:
        dimensions:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [dimension, model_default, devices, distinctiveness, observations, avoid]
            properties:
              dimension: {type: string}
              model_default: {type: string, maxLength: 80}
              devices:
                type: array
                maxItems: 3
                items: {type: string, maxLength: 8}
              distinctiveness: {type: number}
              observations:
                type: array
                maxItems: 5
                items: &learn_finding_item
                  type: object
                  additionalProperties: false
                  required: [statement, confidence, distinctiveness, evidence]
                  properties:
                    statement: {type: string, maxLength: 120}
                    confidence: {type: string, enum: [high, medium, low]}
                    distinctiveness: {type: number}
                    evidence:
                      type: array
                      minItems: 2
                      maxItems: 4
                      items:
                        type: object
                        additionalProperties: false
                        required: [p, quote]
                        properties:
                          p: {type: integer}
                          quote: {type: string, maxLength: 80}
              avoid:
                type: array
                maxItems: 2
                items: *learn_finding_item

  style_ref_extract_narrative:
    version: "2026-09-23.v6"
    input_token_budget: 64000
    system_prompt: *learn_extract_system
    task_prompt: |
      本次分析「叙事层」的 4 个维度(dimension 用英文键):
        - narrative.perspective 叙事视角:人称;视点贴着谁;叙述里夹不夹视点人物的内心吐槽、自问自答、插话式旁白;
          叙述者的口吻(冷静 / 调侃 / 抒情)怎么和人物的声音混在一起;
        - narrative.pacing 节奏控制:快慢怎么切换;紧张时怎么加速(短句、倒计时、连串的短对白、动作切碎);松弛时写什么、
          停在哪里;
        - narrative.time_handling 时间处理:插叙、回忆、时间跳跃怎么接进来、怎么交代时间;
        - narrative.information_density 信息密度:设定与背景怎么交代(对话里带出 / 旁白解说 / 边行动边解释);爱不爱给具体
          数字、计量、时刻;信息什么时候放出来。
      样本见数据块:windows 里每个片段带 window、chapter、position、text(每段以【p】开头)。4 个维度都要输出。
    structured_schema: *learn_extract_schema

  style_ref_extract_scene:
    version: "2026-09-23.v6"
    input_token_budget: 64000
    system_prompt: *learn_extract_system
    task_prompt: |
      本次分析「场景层」的 4 个维度(dimension 用英文键):
        - scene.environment 环境描写:写环境的多少与时机;挑什么细节(光、声音、物件、天气);环境怎么跟人物的动作与
          心情缠在一起;用不用比喻写景;
        - scene.character_portrayal 人物刻画:外貌、动作、小习惯怎么写;从谁的眼里看;用什么比喻、什么参照物形容人;
          人物出场怎么亮相;
        - scene.dialogue 对话写法:对白长短与轮次;人物的口吻、口头禅、插科打诨、说着说着夹进去的私货与抱怨;说话人
          怎么标(「某某说」放前 / 放后 / 不标);对白里的停顿与打断;
        - scene.sensory_priority 感官优先:先写哪种感官;声音、光、触感、气味的写法;感官描写多还是少。
      样本见数据块:windows 里每个片段带 window、chapter、position、text(每段以【p】开头)。4 个维度都要输出。
    structured_schema: *learn_extract_schema

  style_ref_extract_theme:
    version: "2026-09-23.v6"
    input_token_budget: 64000
    system_prompt: *learn_extract_system
    task_prompt: |
      本次分析「主题层」的 4 个维度(dimension 用英文键):
        - theme.emotional_tone 情感基调:幽默、反讽、伤感、热血、紧张、温情怎么并存、在什么时候切换(例如越危险越要
          开玩笑、玩笑底下压着孤独);情绪是直说还是藏着;
        - theme.values 价值取向:叙述对人物与事情的态度——同情谁、嘲弄谁、珍视什么、对「宏大」与「平凡」各持什么态度;
        - theme.motifs 母题意象:反复出现的意象、题材与场面类型——写成可以迁移的类别(如「深夜的便利店」「旧游戏」),
          不写本书专有物件、组织、设定的名字;
        - theme.narrative_philosophy 叙事哲学:对命运、成长、孤独、力量等的整体看法怎样渗进叙述。
      本书特有的世界观专名、组织、物件、设定不要写进陈述;作者的主题离不开它们时,用类别说法。如果你发现这本书有
      一套自己的专有设定(特有的能力、种族、组织、兵器……),可以在 avoid 里写一条「不照搬本书的专有设定体系,
      而是……」,把相关的设定名写进这一条的陈述里——系统会把它们交给「本书专名」步骤处理,不会进文风卡。
      样本见数据块:windows 里每个片段带 window、chapter、position、text(每段以【p】开头)。4 个维度都要输出。
    structured_schema: *learn_extract_schema

  # 文风卡合成(learn_job 第 4 步)。载荷:16 维的发现(每条带 ref 编号与两处 ≤40 字原文短引)、测量核给的绝对声音
  # 习惯、结构事实。实测(190 万字的真实参考书):满载(16 维 × (5 观察 + 2 避免) = 112 条、150 字陈述、每条两处
  # 40 字引文)用户消息 ≈4.6 万字符、估 3.14 万 token;典型(每维 2 + 1 条)估 0.76 万 token → 预算 48000;装不下时
  # learn_card.fit_synthesis_payload 先减引文(2 → 1 → 0)、再减每维每类的发现条数(→ 3 → 2 → 1)。
  style_ref_synthesize_profile:
    version: "2026-09-23.v9"
    input_token_budget: 48000
    system_prompt: |
      你是中文小说文风编辑。输入是对一位作者 16 个维度的逐维发现(每条带编号 ref 与原文短引)、系统用全书统计测出的
      这位作者的声音习惯(voice_habits,绝对、具体:高频词与大致频率)与结构事实(structure_facts)。请把它们写成一张
      「文风卡」:之后每写一场,系统都会把这张卡连同原文样例交给写作模型,让它**代替通用写法、照这位作者的方式写**。
      目标是全面模仿——作者的用词、口头禅、比喻取材、幽默、节奏、对白、价值姿态都要能照着做。

      输出:
        - profile_title:≤20 字,概括这位作者的写法(不写书名、人名)。
        - qualitative_summary:80–200 字,这位作者整体怎么写、是什么气质。
        - temperament:≤4 行,这位作者的气质与情绪调性——幽默、反讽、伤感、紧张等怎么共存、什么时候切换
          (例如「越危险越要开玩笑,玩笑底下压着孤独」)。气质是每场都必须体现的,写得具体。
        - dimensions:16 维各一项(dimension 用输入里的英文键):
            summary:≤40 字,一句话概括这一维;
            model_default:≤60 字,通用模型在这一维的默认写法(可沿用输入的 model_default,改得更准);
            do:1–3 条写给写作者的指令,句式是「代替〔模型默认〕,〔怎么写〕」或直接「〔怎么写〕」;每条 ≤60 字,可以
              带作者的原词作例子(用「」括起,每处 ≤10 字);refs 列出它依据的发现编号(如 f3、f7,至少一个);
              mandatory 只标这位作者**最有辨识度、每场都该体现**的几条(全卡 2–4 条);distinctiveness 0–1;
            avoid:0–2 条「这位作者不这么写」,写成「不……(而是……)」,refs 同上,mandatory 一律 false;
            devices:≤3 个招牌手法名(≤8 字),沿用发现里的手法名,同义的合并;
            distinctiveness:0–1。
        - planning_guidance:≤10 行,规划一场戏时用得上的手法,格式「标签：陈述」(标签如 开场 / 收场 / 对白 / 冲突 /
          节奏 / 情绪基调 / 场面),写这位作者怎么安排一场戏。

      对账(必须做):
        - 互相矛盾的说法只留一个:保留证据更多、更具体的那条(例如一处说逗号用得密、另一处说逗号稀疏,看哪边的发现
          证据多、与 voice_habits 是否一致);**绝不**输出两条互相矛盾的指令。
        - 和 voice_habits 矛盾的说法以 voice_habits 为准(那是全书统计);但卡里不要重复 voice_habits 已经写了的内容
          (声音习惯会单独给写作模型)——卡片写声音习惯说不出来的东西:取材、口吻、幽默、手法、态度。
        - 不写阿拉伯数字、百分比、平均值;频率只用「大约每十句一次」「常」「偶尔」这类说法。
        - 不写本书的人名、地名、组织、专有物件与设定名。
        - 不整句照抄原文;引作者原词每处 ≤10 字。
        - 没有发现支撑的维度,do 给空数组,不要编造。
      只输出 schema 规定的 JSON。
    task_prompt: |
      输入见数据块:book_title、dimensions(16 维;每维 label、model_default、devices、distinctiveness、observations 与
      avoid,每条发现带 ref / statement / confidence / quotes)、voice_habits、structure_facts。
      16 维全部读完再下笔。每条 do / avoid 必须在 refs 里写它依据的发现编号,系统据此把卡片连到原文证据;没有依据的句子
      会被丢弃。
    structured_schema:
      type: object
      additionalProperties: false
      required: [profile_title, qualitative_summary, temperament, dimensions, planning_guidance]
      properties:
        profile_title: {type: string, maxLength: 20}
        qualitative_summary: {type: string, maxLength: 240}
        temperament:
          type: array
          maxItems: 4
          items: {type: string, maxLength: 90}
        dimensions:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [dimension, summary, model_default, distinctiveness, devices, do, avoid]
            properties:
              dimension: {type: string}
              summary: {type: string, maxLength: 60}
              model_default: {type: string, maxLength: 90}
              distinctiveness: {type: number}
              devices:
                type: array
                maxItems: 3
                items: {type: string, maxLength: 8}
              do:
                type: array
                maxItems: 3
                items: &learn_card_line
                  type: object
                  additionalProperties: false
                  required: [text, refs, mandatory, distinctiveness]
                  properties:
                    text: {type: string, maxLength: 90}
                    refs:
                      type: array
                      minItems: 1
                      maxItems: 4
                      items: {type: string}
                    mandatory: {type: boolean}
                    distinctiveness: {type: number}
              avoid:
                type: array
                maxItems: 2
                items: *learn_card_line
        planning_guidance:
          type: array
          maxItems: 10
          items: {type: string, maxLength: 90}

