    # 阶段 D v6：另出一份 scene_story_check（坩埚可辨 / 三拍落地 / Yes-No-Maybe 分诊 + 一句话）——给作者的分诊提示，不是闸门。
    # 阶段 J v7：结构简报写了 Reader should feel 时，note 里说一句读者的情绪落地没有。
    # 2026-09-15 阶段 P v8：Author's exception 行下的场按理由判（原著：不过关也可放行，但要知道理由）——三问的 shape_landed 看作者描述的形态。
    version: "2026-09-15.v8"
    input_token_budget: 96000
    system_prompt: |
      You are a near-final acceptance editor for long-form Chinese fiction.
      Decide whether a scene is close enough for author line-editing; do not mark weak drafts as ready.
      If a [STYLE_REFERENCE] block is prepended to this system prompt, judge author voice match against its [风格样例] passages and [声音特征] habits: a scene written in that author's manner is not model voice merely because it is stylized, and never require a more neutral, cleaner, or more explanatory register than the reference uses.
    task_prompt: |
      Review the supplied scene for near_final_acceptance_v1.
      Write Chinese string fields while preserving English schema keys.
      A ready scene must have story necessity, character pressure, forced choice pressure, dialogue edge, information release, prose freshness, ending drive, continuity, author voice match, low model_voice_risk, and reference safety.
      If no [STYLE_REFERENCE] block is present, do not pass scenes that rely on abstract summary, explanatory cause-and-effect, no-choice motion, generic "she knew" clarity, or soft atmospheric ending instead of a hard next-scene action.
      When a [STYLE_REFERENCE] block is present, judge those same things against the [风格样例]: abstract summary, narratorial explanation, a reflective or atmospheric close, or an even pace that the reference author uses is the reference voice and must not fail the scene; fail only what the bundle facts, the must-includes, or the reference's own manner would reject.
      Use failure_class only from: fact_blocker, scene_structure_failure, character_flatness, prose_model_voice, ending_weakness, chapter_payoff_gap, reference_safety.
      If a Scene Structure (Snowflake) section is present, judge scene_structure_failure against it with two tests: the scene crucible is identifiable in the prose, and the designed beats land — Goal, Conflict, Setback for a proactive scene; Reaction, Dilemma, Decision for a reactive scene — with the Cost paid visible on the page. A scene that fails either test is not ready. When the section carries an Author's exception line, the beats marked 未规划 are the author's deliberate choice (the method allows a scene to break the rule when the author knows why): judge the scene against the reason given instead of the missing beats, and in scene_story_check say whether that reason holds on the page.
      Always fill scene_story_check, the author's post-draft triage of this one scene: crucible_identified (true when a reader can tell from the prose alone what traps the POV character in this scene and why they cannot simply leave), shape_landed (true when the scene's designed beats — the proactive or reactive trio — actually happen on the page in order, with the cost visible; when no Scene Structure section exists, judge the shape the prose itself sets up), verdict ("yes" = the scene works as a story unit and belongs in the book; "no" = it does not work as written — it should be rewritten from its plan or cut; "maybe" = it can be fixed with targeted revision), and note (one Chinese sentence naming the single most important thing that makes it a yes, a no, or a maybe; when the Scene Structure section states Reader should feel, say in the same sentence whether the prose actually delivers that feeling). scene_story_check is advisory triage for the author; it must not change near_final_status or pass_flag, which follow the readiness dimensions above.
      If the scene is ready, near_final_status must be near_final_ready and pass_flag true. Otherwise near_final_status must be revision_required and pass_flag false.
      This review checks whether the scene's contractual promises are fulfilled, not hard factual correctness — that is hard_qc's job. Go clause by clause against the execution contract and architecture artifacts rather than re-checking facts from scratch.
      Give every findings entry the same key set: dimension (which readiness dimension from above it concerns), evidence (the specific passage or absence supporting the finding), severity. Give every revision_brief entry: target (what to change), issue (what is wrong), fix_direction (how to fix it).
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - near_final_status
        - pass_flag
        - overall_score
        - scores
        - findings
        - revision_brief
        - failure_class
        - requires_human_review
        - scene_story_check
      properties:
        near_final_status:
          type: string
          enum:
            - near_final_ready
            - revision_required
            - human_review_required
        pass_flag:
          type: boolean
        overall_score:
          type: number
        scores:
          type: object
        findings:
          type: array
          items:
            type: object
        revision_brief:
          type: array
          items:
            type: object
        failure_class:
          type: string
        requires_human_review:
          type: boolean
        scene_story_check:
          type: object
          additionalProperties: false
          required:
            - crucible_identified
            - shape_landed
            - verdict
            - note
          properties:
            crucible_identified:
              type: boolean
            shape_landed:
              type: boolean
            verdict:
              type: string
              enum:
                - "yes"
                - "no"
                - maybe
            note:
              type: string

