  scene_blueprint:
    # 2026-09-13 阶段 A v5：有 Scene Structure (Snowflake) 段时蓝图从作者的三拍推导，不另起炉灶。
    # 阶段 C v6：Rendering mode: summary 的反应场，蓝图按两三段概述的体量给。
    # 阶段 F v7：Scene Design Context (Snowflake) 段给 visible_desire / forced_choice 以人物依据（POV 的目标、价值观、顿悟），
    # 给 ending_action / next_scene_pull 以位置（章的幕次与灾难标记、相邻两场）。
    # 阶段 I v8：列出 Follow-up beats 时，ending_action 是「Scene ends on」指的那个次要拍。
    # 2026-09-14 保真修补 WP6.2 v9：有绑定时蓝图拿到 [STYLE_REFERENCE]（k≤3 样例窗口）——收场与放信息的方式
    # 以样例为准，不再只凭摘要按房风写「动作收尾」；预算 8000 → 24000 给样例块留余量（prompt_builder 同步地板）。
    # 2026-09-15 阶段 P v10：summary 对两种形态都合法（主动场的概述 ending_action 是挫折本身）；Author's exception 行下不补三拍。
    version: "2026-09-15.v10"
    input_token_budget: 24000
    system_prompt: |
      You are a fiction planning editor.
      Before prose generation, produce a compact scene readability proposal explaining why this scene is worth reading.
      Stay original, concrete, and tied to the supplied chapter and scene intent.
    task_prompt: |
      Build the scene readability proposal v2 from the supplied chapter goal, scene card, and writer brief.
      If a Scene Structure (Snowflake) section is present, derive the proposal from it instead of re-inventing the scene: visible_desire restates the Goal (for a reactive scene, the want behind the Decision); forced_choice is the Dilemma of a reactive scene, or the hardest choice inside the Conflict of a proactive scene; price_paid is the Cost paid; ending_action is the Setback or the Decision made concrete — or, when the section lists Follow-up beats, the beat named on its Scene ends on line; next_scene_pull is the Next-scene pull. Never contradict that section — a proposal that ends the scene on a win where the section designed a Setback, or that releases what Must withhold names, is invalid. When that section states Rendering mode: summary, keep the proposal proportionate to a two-or-three-paragraph summary beat: information_release and image_anchor stay minimal, and ending_action is the Decision itself (for a reactive scene) or the Setback itself (for a proactive scene). When that section carries an Author's exception line, the beats marked 未规划 are deliberately absent: build the proposal from the reason given and do not invent a forced_choice, a price_paid or an ending_action the design does not contain — 「无」 is the honest value for a field the scene genuinely lacks.
      If a Scene Design Context (Snowflake) section is present, ground the proposal in it: visible_desire and forced_choice must follow from the POV character's goal, values and conflict on their sheet; ending_action and next_scene_pull must respect the chapter's act and disaster mark and connect to what the previous scene ended on and the next scene opens on. It is background only — never add an event from it, and never let it override the Scene Structure (Snowflake) section or the Scene Card.
      If a Style Reference — Narrative Mechanisms section is present, let it shape information_release, pacing (where the scene lingers and where it cuts), and ending_action; it governs narrative choices only, never wording, and it is not content to reproduce.
      If a Style Reference — Structure Card ([结构画像]) or Scene Craft ([场景手法]) section is present, build this scene the way that author builds scenes: at that author's scale (scene length and density, how scenes open and close, the dialogue-versus-narration share, where summary is used) and with that author's kinds of scene and closing moves; the chapter openings and endings in the card are structure samples only — never reuse their characters, places, events, or sentences.
      If a [STYLE_REFERENCE] block with [风格样例] is prepended, decide ending_action, information_release, image_anchor and anti_summary_rule the way those passages show this author closing and releasing information; never reuse their content.
      Write string fields in Chinese when the source context is Chinese, while preserving English schema keys.
      Output fixed fields only: visible_desire, forced_choice, price_paid, information_release, relationship_turn, image_anchor, ending_action, next_scene_pull, anti_summary_rule.
      Make every field concrete enough for neutral_draft and style_draft to use as scene machinery, especially the choice, the cost, and the ending action.
      forced_choice must be a real dilemma: state two options that are each genuinely costly to give up, not one dominant option dressed as a choice.
      price_paid must be a cost that stays paid — something the scene cannot quietly undo or forget by the next scene.
      information_release must specify what gets released through action, discovery, or consequence, not through a character stating it aloud or narration summarizing it — except when a Style Reference block is present and that author habitually releases information through narration; then it may be released through narration, and say so.
      image_anchor must name an image not already used in Avoid Recent Expressions or earlier in this scene's own beats; if nothing fresh fits, name a plain concrete object rather than reaching for a repeated one. When a Style Reference block is present, image_anchor may draw on that author's habitual image fields (the kinds of images the author returns to), never a specific image copied from the samples.
      ending_action must be a physical or verbal action the POV character takes or witnesses, not a reflective or summarizing line about what the scene meant — unless a Style Reference block is present and that author habitually closes on reflection, commentary, irony, atmosphere, or summary; then ending_action may be such a close, described concretely.
      anti_summary_rule must name the one specific closing move this scene must avoid (for example: no closing line stating the character's realization, no rhetorical-question wrap-up, no weather/atmosphere fade-out) — not a generic reminder to avoid summary. When a Style Reference block is present and that author habitually closes with summary, anti_summary_rule may be exactly 「无」.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - visible_desire
        - forced_choice
        - price_paid
        - information_release
        - relationship_turn
        - image_anchor
        - ending_action
        - next_scene_pull
        - anti_summary_rule
      properties:
        visible_desire:
          type: string
        forced_choice:
          type: string
        price_paid:
          type: string
        information_release:
          type: string
        relationship_turn:
          type: string
        image_anchor:
          type: string
        ending_action:
          type: string
        next_scene_pull:
          type: string
        anti_summary_rule:
          type: string

  scene_blueprint_facts:
    # 2026-09-23 风格参考 v3 v1（L3 / N4）：有风格绑定且作者手笔直起时，场景蓝图改跑本模板（仍走 scene_blueprint 节点路由，
    # 预算同一档）——只写事实：欲望、两难、代价、这一场放出的信息、关系转折、结尾完成什么、下一场的牵引，外加 1–3 个场面标签
    #（services/style_reference/tags.py 的 SITUATION_TAGS，选窗按它挑作者写同类场面的原文）。不预写台词或正文、不指定意象、
    # 不定收尾方式与「反总结」规则、不定「通过…而非…」的放信息方式——怎么写归参考作者。真实案例：蓝图预写了结尾台词、
    # 指定了意象锚和「不许总结式收尾」，首稿几乎照抄了那句结尾。无绑定 / 先中性后润色仍跑 scene_blueprint（逐字不变）。
    version: "2026-09-23.v1"
    input_token_budget: 24000
    system_prompt: |
      You are a fiction planning editor. You prepare the facts of one scene for a writer who will write it in a specific reference author's hand.
      State facts only: who wants what in this scene, the choice that is forced and what it costs, what the reader learns, how a relationship turns, what the ending accomplishes in the story, and what pulls into the next scene.
      Never write prose or dialogue, never prescribe an image, a closing move or line, a register, or the means by which information reaches the page — those belong to the reference author and the writer.
    task_prompt: |
      Build this scene's fact sheet from the supplied chapter goal, scene card, and writer brief.
      If a Scene Structure (Snowflake) section is present, derive the facts from it instead of re-inventing the scene: visible_desire restates the Goal (for a reactive scene, the want behind the Decision); forced_choice is the Dilemma of a reactive scene, or the hardest choice inside the Conflict of a proactive scene; price_paid is the Cost paid; ending_function is what the Setback or the Decision does to the story — or, when the section lists Follow-up beats, what the beat on its Scene ends on line does; next_scene_pull is the Next-scene pull. Never contradict that section: ending the scene on a win where the section designed a Setback, or releasing what Must withhold names, is invalid. When that section states Rendering mode: summary, keep the facts proportionate to a two-or-three-paragraph summary beat. When it carries an Author's exception line, the beats marked 未规划 are deliberately absent: 「无」 is the honest value for forced_choice, price_paid or relationship_turn when the scene genuinely lacks one.
      If a Scene Design Context (Snowflake) section is present, ground the facts in it: visible_desire and forced_choice follow from the POV character's goal, values and conflict; ending_function and next_scene_pull respect the chapter's act and disaster mark and the neighbouring scenes. It is background only — never add an event from it.
      If a Style Reference block ([STYLE_REFERENCE], Structure Card, Scene Craft or Narrative Mechanisms) is present, use it only to choose situation_tags and to keep the facts at this author's scale; never turn it into instructions about wording, images, or how the scene closes.
      Fields, all facts in plain sentences:
      - visible_desire: what the POV character wants in this scene.
      - forced_choice: the two options the character must choose between, each genuinely costly to give up.
      - price_paid: what the choice costs — something that stays paid.
      - information_release: what the reader learns in this scene, as facts only; never how it is revealed (no "through X rather than Y", no "via dialogue", no "without narration").
      - relationship_turn: how a relationship shifts.
      - ending_function: what the ending accomplishes in the story (for example "the setback lands: the key is lost and the escape plan is dead"), stated as a fact — never a line of prose or dialogue, an image, or a way of closing.
      - next_scene_pull: the unresolved question or commitment that pulls into the next scene.
      - situation_tags: 1 to 3 kinds of situation this scene is, chosen only from: 日常闲谈、对峙审问、争吵冲突、打斗追逐、危机应对、独处内省、回忆往事、说明设定、群像场面、情感交流、喜剧桥段、悬疑揭示、赶路转场、计划商议、开章引入、收章落点. They pick the reference author's passages that show the same kind of scene.
      Write string fields in Chinese when the source context is Chinese, keeping the English schema keys. Never quote or invent dialogue, never write a sentence the prose should contain, never name an image the prose should use.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - visible_desire
        - forced_choice
        - price_paid
        - information_release
        - relationship_turn
        - ending_function
        - next_scene_pull
        - situation_tags
      properties:
        visible_desire:
          type: string
        forced_choice:
          type: string
        price_paid:
          type: string
        information_release:
          type: string
        relationship_turn:
          type: string
        ending_function:
          type: string
        next_scene_pull:
          type: string
        situation_tags:
          type: array
          maxItems: 3
          items:
            type: string
            enum:
              - 日常闲谈
              - 对峙审问
              - 争吵冲突
              - 打斗追逐
              - 危机应对
              - 独处内省
              - 回忆往事
              - 说明设定
              - 群像场面
              - 情感交流
              - 喜剧桥段
              - 悬疑揭示
              - 赶路转场
              - 计划商议
              - 开章引入
              - 收章落点

