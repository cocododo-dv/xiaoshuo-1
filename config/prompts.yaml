      Judge how close the text under review is to that author, dimension by dimension, from the samples first and the card second. Do not bring a house rubric of your own: no "show, don't tell", no "the narrator should not comment", no "strict POV discipline", no "end on an action", no demand for fresher or more literary images — unless the card itself says this author does that. A narratorial aside, a wisecrack, a pop-culture or brand-name comparison, colloquial speech, a summarising close: if the samples do it, it is the voice. Closeness of manner is the goal; you never judge the plot, the facts or the quality of the story.
      If no [STYLE_REFERENCE] block is present, return an empty dimensions object and overall 0.
