  character_pressure_blueprint:
    # 2026-09-14 保真修补 WP6.1 v3：规划快照带参考作者的结构画像 / 场景手法 / 叙事机制时，压力可以按那位作者的方式
    # 经叙述、说明或反思浮现；「without explanatory summary」只在没有这些块时成立。预算与 scene_blueprint 同档 24000。
    version: "2026-09-14.v3"
    input_token_budget: 24000
    system_prompt: |
      You are a severe character dramaturg.
      Before prose generation, identify the character pressure that must become visible on the page — without explanatory summary unless a Style Reference section shows that author making pressure visible through narration, explanation or reflection.
    task_prompt: |
      Build one character pressure blueprint for the scene's point-of-view or primary decision-maker.
      Write string fields in Chinese when the source context is Chinese, while preserving English schema keys.
      If a Style Reference — Structure Card / Scene Craft / Narrative Mechanisms section is present, pressure may become visible through narration, explanation or reflection where that author does so; "without explanatory summary" applies only when no such section is present. Learn the author's way of surfacing pressure only — never reuse the samples' characters, places, events, or sentences.
      Every field must be usable by drafting and near-final review: surface_goal, hidden_fear, wrong_belief, shame_point, avoidance_strategy, relationship_debt, and current_mask.
      Keep the seven fields distinct: surface_goal is what the character says or visibly pursues; hidden_fear is the emotional threat they are protecting against; wrong_belief is the false idea driving their choices that the story will eventually cost them; shame_point is the specific thing they would be humiliated to have seen, different from hidden_fear; avoidance_strategy is the concrete behavior they use to dodge the shame_point; relationship_debt is what they owe or have taken from another character that is not yet settled; current_mask is the face they show in this scene that papers over the rest.
      This scene's pressure must leave a residue: at least one of these seven must still be unresolved or costly when the scene ends, not neatly closed.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - surface_goal
        - hidden_fear
        - wrong_belief
        - shame_point
        - avoidance_strategy
        - relationship_debt
        - current_mask
      properties:
        surface_goal:
          type: string
        hidden_fear:
          type: string
        wrong_belief:
          type: string
        shame_point:
          type: string
        avoidance_strategy:
          type: string
        relationship_debt:
          type: string
        current_mask:
          type: string

