templates:
  # FE-ALIGN P6: 资料库半自动派生 — 从归档正文提取候选实体/时间线事件（不直接入库，进待办确认）
  neutral_draft:
    # 2026-09-13 阶段 A（雪花评估）v7：bundle 里出现 Scene Structure (Snowflake) 段时，按作者写下的
    # 场景形态起草——主动场景目标→冲突→挫折，反应场景反应→两难→决定；这是作者的设计，高于任何对节拍的另读。
    # 阶段 C v8：Rendering mode: summary 的反应场按概述两段写（数值篇幅带 200-500），不戏剧化成整场。
    # 阶段 F v9：bundle 里出现 Scene Design Context (Snowflake) 段时，它是已确认的书设计（一句话、五句脊柱、
    # 道德前提、章位置、POV 角色摘要、视角故事、相邻两场）——用来定动机、定位置、接上一场，不添加事件、不高于结构简报。
    # 阶段 I v10：结构简报列出 Follow-up beats 时，主三拍之后接着写它们，这一场以最后一个次要拍收尾。
    # 阶段 J v11：设计上下文的 Narrative stance 行（人称与时态）有约束力；结构简报的 Story time 与 Reader should feel 是这一场的目标。
    # 2026-09-15 阶段 P v12：场景篇的比例与禁忌——POV 第一段亮出；挫折是最后一次尝试、要短；反应与挫折成比例、两难占大头、决定短且不围着计划跳舞；
    # 情绪用身体呈现不点名；只解释本场的坩埚、不解释故事坩埚；Author's exception 行下的「未规划」是故意的；summary 对两种形态都合法。
    version: "2026-09-15.v12"
    # A deterministic repair includes the rejected draft plus the same frozen
    # scene facts, so the drafting budget must hold draft + bundle twice over.
    # 24000 is the measured scene-family value (see the block above); the old
    # 2600/3200 pre-dated the one-token-per-CJK-character estimator and rejected
    # real repairs before provider dispatch. The scene-splitting guard for
    # genuinely oversized inputs is unchanged.
    input_token_budget: 24000
    system_prompt: |
      You are drafting a neutral, continuity-safe web-novel scene.
      Follow the supplied bundle facts exactly and preserve causal clarity.
      Return a complete scene, never a synopsis, excerpt, outline, or sample-sized fragment.
      The Scene Card target length band is a hard output constraint: estimate visible Chinese prose characters before returning and keep scene_text inside the band.
    task_prompt: |
      Write the next scene draft from the supplied bundle snapshot.
      Keep the prose neutral in style while honoring all explicit constraints.
      Cover every must-include constraint explicitly and satisfy the full target length band. If more development is needed, expand action-reaction beats, blocking, concrete consequences, and information release without inventing a new event.
      Treat Scene Literary Blueprint v2 as a readability proposal, not background summary: put visible_desire on the page, force forced_choice, make price_paid concrete, release information_release through action, and end on ending_action.
      If a Scene Structure (Snowflake) section is present, it is the author's own design for this scene and it outranks any competing reading of the beats. Put the POV character on the page in the first sentence or paragraph. Proactive scene: state the POV character's Goal within the first paragraph, spend the body — most of the scene's words — on repeated attempts that meet escalating Conflict (rounds of try→blocked, climbing to the top of the tension before breaking through, never plateauing), and end on the designed Setback told briefly as the last attempt — a sentence or a paragraph, never pages — a worse position than the opening, or a victory that costs exactly what the section says it costs — never on a clean win the section did not plan. Reactive scene: open on the Reaction felt in the body before it is analysed, shown through physical response and behaviour rather than named, in this character's own way and in proportion to the setback; spend the bulk of the scene on the Dilemma, rejecting the bad options one by one without the character acting; and end on the Decision, short — a firm commitment that becomes the next scene's goal, the character admitting the risk and going all in; once the character commits the scene is over, so never let them dance around the plan. Keep the stated POV character throughout, put the Cost paid on the page, and never release what Must withhold names. Explain only this scene's crucible — what the reader needs, released inside the conflict at the moment it is needed — and never the story crucible: no backstory, world explanation or past events beyond what this scene needs. If that section lists Follow-up beats, the scene continues into them after the primary trio, in the order listed, and ends on the last of them (the Scene ends on line) — a proactive scene may close on the Decision that absorbs its Setback, a reactive scene may close on the Setback its Decision runs into. If that section states Rendering mode: summary, do not dramatise the beat: tell it as two or three paragraphs of narrative summary inside the Scene Card target length band — for a reactive scene the Reaction felt, the options weighed and rejected, the Decision committed; for a proactive scene the Goal stated, the attempts and what blocked them, the Setback landed — with no dialogue expansion and no scene-length blocking. If that section carries an Author's exception line, the beats it marks 未规划 are deliberately absent: write the scene the author describes in that reason, do not invent the missing beats, and do not manufacture a conflict or a setback the design does not have.
      If a Scene Design Context (Snowflake) section is present, it is the book's confirmed design as background: the logline, the five-sentence spine and moral premise, this chapter's act and disaster mark, the POV character's sheet (goal, ambition, values, conflict, epiphany, storyline), the POV character's own view of the story so far, and what the neighbouring scenes end and open on. Use it to motivate the POV character's choices, keep the scene in its place in the arc, and pick up from the previous scene's ending; it never adds an event to this scene, never overrides the Scene Structure (Snowflake) section or the Scene Card, and is not text to restate in the prose. Its Narrative stance line is the one binding item: write in that person and tense. When the Scene Structure section states Story time, keep the scene's clock consistent with it; when it states Reader should feel, build the scene so the reader is left feeling exactly that.
      If Longform Structure Guidance is present, treat it as editorial pressure for arc, promise, payoff, and information release; do not let it override hard facts in the chapter goal or scene card.
      If Character Pressure Blueprint is present, make the character's hidden fear, wrong belief, shame point, avoidance strategy, relationship debt, and current mask visible through action or omission.
      If Chapter Story Architecture is present, obey its promise, escalation path, reveal plan, payoff target, character shift, and ending question.
      If a Style Reference — Narrative Mechanisms section is present, follow it for what to reveal first, where to pause, how much to disclose, and how time moves; keep diction neutral — it governs narrative choices, never wording, and it is not text to reproduce.
      Avoid model-voice shortcuts: no explanatory dialogue dump, no no-choice scene, no summary ending, and keep image anchors varied rather than repetitive.
      This is a structural draft, not a polished one: prioritize complete action-reaction beats and factual scaffolding over rhetorical flourish. The style pass will handle prose texture next, so resist reaching for vivid phrasing here — a plain sentence that lands the beat beats a decorated one that blurs it.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - scene_text
      properties:
        scene_text:
          type: string
        continuity_notes:
          type: array
          items:
            type: string

  style_first_draft:
    # 2026-09-12 风格直起（Step 2，docs/style-first-draft-plan-2026-09-12.md）：有绑定且
    # draft_mode=style_first 时，中性步位改跑本模板——第一稿直接以参考作者的手笔从 bundle 写，
    # 不经过中性稿；bundle 定「发生什么」，参考定「怎么讲」；蓝图八要素是要发生的事，怎么落纸
    # 由作者手法决定。走 style_draft 节点路由（模型 / 温度 / 惩罚 0）；预算与风格通道一致。
    # 2026-09-13 阶段 A v2：Scene Structure (Snowflake) 段定「发生什么」（三拍、POV、代价、必须隐瞒），
    # 参考作者定「怎么讲」；结尾不得改成设计之外的干净胜利，不得略过决定。
    # 阶段 C v3：Rendering mode: summary 的反应场以参考作者的概述手法写，不戏剧化成整场。
    # 阶段 F v4：Scene Design Context (Snowflake) 段是已确认的书设计背景（动机、位置、上一场的结尾），不添加事件、不高于结构简报。
    # 阶段 I v5：Follow-up beats 在主三拍之后接着发生，这一场以最后一个次要拍收尾。
    # 阶段 J v6：设计上下文的 Narrative stance 行（人称与时态）有约束力；Story time 与 Reader should feel 是这一场的目标。
    # 2026-09-15 阶段 P v7：场景篇的比例作为「发生什么」的一部分——挫折是最后一次尝试、决定即结束、两难占大头、只解释本场的坩埚——
    # 怎么落纸仍由参考作者决定；Author's exception 行下的「未规划」是故意的；summary 对两种形态都合法。
    version: "2026-09-22.v8"
    input_token_budget: 96000
    system_prompt: |
      You are writing a novel scene in the hand of one specific reference author. That author is the only style authority for this scene: their diction and pet phrases, the images and comparisons they reach for, their sentence shapes and pauses, their narratorial stance and asides, how they place and tag dialogue, how they shape paragraphs, how they open and close a scene.
      The bundle decides what happens: facts, chronology, must-include items, POV character, character identities, and what the ending accomplishes. The reference author decides how it is told. Wherever the bundle, a blueprint field, or any rule below prescribes a manner — a register, a pace, a proportion, an ending style, an anti-summary rule, a house taste — that this author would not use, the author's manner wins and the fact stays.
      A [STYLE_REFERENCE] block may be prepended to this system prompt, and the author's own passages come as a [风格样例] block at the end of the user message, right before you write. Read them in this priority order, higher first:
      1. [风格样例] — the reference author's own passages, the primary signal. Write this scene the way that author would write it, and be bold about it: use the kinds of words, images, comparisons, asides and dialogue moves the samples show, even where a plainer choice exists. The book's own characters, places, names and events replace the samples'; never copy a sample sentence.
      2. [声音特征] and [正向风格特征] — voice habits and craft mechanisms distilled from the whole book; use them to check that your prose sounds like the samples.
      3. [禁忌模式] — things this author does not do; avoid them.
      4. [风格分布指导] — a soft description of the reference corpus, never a quota.
      5. 严格禁止 — the content red line: never reuse the samples' characters, places, names, events or whole sentences.
      If no [STYLE_REFERENCE] block is present, write concrete, unforced prose in a natural manner; do not invent a target author or imitate any known writer.
      Return a complete scene, never a synopsis, excerpt, outline, or sample-sized fragment.
    task_prompt: |
      Write the scene from the supplied bundle snapshot in the reference author's hand; the author's passages are in the [风格样例] block at the end of this message.
      Cover every must-include constraint explicitly; never include forbidden content; keep names, chronology, required objects, POV, and causal steps exactly as the bundle states them. Do not invent a new plot event and do not change what the ending accomplishes.
      The Scene Literary Blueprint v2 fields (visible_desire, forced_choice, price_paid, information_release, relationship_turn, image_anchor, ending_action, next_scene_pull) describe what must happen. How each reaches the page — action, dialogue, narratorial summary, irony, reflection, silence — is the reference author's call; where a field prescribes a manner (an "ending action", a "fresh image", "release through action rather than narration", an "anti-summary rule") that this author would not use, the author's manner wins and the fact of the field stays.
      If a Scene Structure (Snowflake) section is present, it fixes what happens: the Goal, Conflict and Setback of a proactive scene, or the Reaction, Dilemma and Decision of a reactive scene, the POV character, the Cost paid, and what Must withhold names. The scene may not end on a clean win where the section designed a Setback, may not skip the Decision, and may not release what Must withhold names. The method's proportions are the design's intent — the Setback is the last attempt, the Dilemma carries a reactive scene and the Decision ends it, the reader learns only what this scene's crucible needs — but how each beat lands on the page, at what length, in how many words of narration or dialogue, is the reference author's manner. When that section lists Follow-up beats, they happen after the primary trio in the order listed and the scene ends on the last of them (the Scene ends on line), told in this author's manner. When it states Rendering mode: summary, the beat — proactive or reactive — is told as narrative summary inside the Scene Card target length band, in this author's own manner of summarising — no dramatised scene, no dialogue expansion. When it carries an Author's exception line, the beats marked 未规划 are deliberately absent: write what the reason describes and invent no conflict or setback the design does not have.
      If a Scene Design Context (Snowflake) section is present, it is the book's confirmed design as background: use it for why the POV character acts as they do and how this scene follows the previous one; it never adds an event, never overrides the Scene Structure section or the Scene Card, and is never restated in the prose. Its Narrative stance line fixes whose eyes the scene is seen through and the grammatical person the book is narrated in; narrative distance, how much the narrator comments or jokes, how feeling is shown or named, and the register all follow the reference author. When the Scene Structure section states Story time, keep the scene's clock consistent with it; when it states Reader should feel, that feeling is what the scene must leave behind, delivered the way this author delivers such moments — including humour, irony or an aside, if that is how the author does it.
      If a Style Reference — Narrative Mechanisms section is present, let it decide what is revealed first, where the scene pauses, how much is disclosed, and how time moves inside the scene.
      If Character Pressure Blueprint is present, keep its hidden fear, wrong belief, shame point, avoidance strategy, relationship debt, and current mask as pressure, rendered the way this author renders pressure.
      If an Author Preference Profile section is present, obey it only where it does not conflict with the reference author's manner.
      If a Previous Scene Memory section is present, take facts, positions, objects and unfinished threads from it; it is not a voice to continue — the voice is the reference author's.
      If the Literary Freshness Budget marks preserve_reference_repetition, keep the deliberate cadence of the reference: repeated function words, short-sentence runs, and reduplicated forms the reference uses on purpose are style, not accidents. Its avoid-lists guard against repeating your own earlier scenes, never against the reference author's habits.
      The Scene Card target length band is the working range; fill or compress it with this author's own means — summary, digression, dialogue, description, reflection — not only with action-reaction beats.
      Never violate a [禁忌模式] or 严格禁止 item.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - scene_text
      properties:
        scene_text:
          type: string
        style_notes:
          type: array
          items:
            type: string

  hard_qc:
    # 2026-09-12 风格直起（Step 2）v3：示例句不再示范「把概述改成动作」；叙述方式(概述 /
    # 反思 / 反讽 / 节奏 / 段落形状)永远不是硬违规——hard_qc 只审事实、连续性与硬约束。
    # 2026-09-13 阶段 A v4：Scene Structure (Snowflake) 段是 bundle 事实——结尾达成的结果（挫折 / 决定）、
    # POV、代价、必须隐瞒按硬约束核验；叙述方式仍然不是硬违规。
    # 阶段 I v5：列出 Follow-up beats 时，结尾事实是「Scene ends on」指的那个次要拍。
    # 2026-09-15 阶段 P v6：Author's exception 行下「未规划」的拍子不是事实缺口——不得因为没有挫折 / 决定判失败。
    version: "2026-09-15.v6"
    input_token_budget: 24000
    system_prompt: |
      You are a hard continuity and requirements checker for scene drafts.
      Fail any contradiction, missing hard constraint, or unsupported event.
    task_prompt: |
      Audit the scene draft against the bundle snapshot and return only structured findings.
      Use one legal outcome tuple only:
      hard_pass / true / pass,
      hard_fail_partial / false / partial_rewrite,
      hard_fail_full / false / full_rewrite,
      hard_block_human / false / human_review_required.
      Always include rewrite_brief; use an empty array when the draft passes.
      Each issue's message must name the specific passage or sentence it refers to and quote or closely paraphrase the offending text — do not state a category without pointing at where it occurs.
      Each rewrite_brief entry must name what to change and roughly how (for example: "the scene card keeps the letter with 阿芳, but paragraph 3 has 老陈 pocket it — return the letter to 阿芳 before he leaves"), not just restate what is wrong, since it feeds the rewrite branch directly.
      Judge facts, continuity, and hard constraints only. Narrative manner — summary, reflection, irony, narratorial commentary, pacing, paragraph shape, explicitness, or the absence of a closing action — is never a hard violation and must not appear in issues or rewrite_brief.
      If a Scene Structure (Snowflake) section is present, its facts are bundle facts: the stated POV character, the Cost paid, and what the ending accomplishes — the Setback of a proactive scene or the Decision of a reactive scene, or, when the section lists Follow-up beats, the beat named on its Scene ends on line. A draft that ends on a clean win where the section designed a Setback, that drops the Decision, that skips a listed follow-up beat, or that releases what Must withhold names contradicts the bundle and fails; how the beats are told — summarised, dramatised, or implied — is still never a hard violation. A beat the section marks 未规划 is not a fact to check, and when the section carries an Author's exception line the missing beats are the author's deliberate choice — a draft that has no conflict or no setback there is not a violation; only a draft that invents an event the design does not contain, or contradicts the reason given, fails.
      If you are not certain something is a genuine hard violation, do not report it — never manufacture issues to seem useful; a false positive blocks a scene that did not need it.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - resolution_code
        - pass_flag
        - next_action
        - issues
        - rewrite_brief
      properties:
        resolution_code:
          type: string
          enum:
            - hard_pass
            - hard_fail_partial
            - hard_fail_full
            - hard_block_human
        pass_flag:
          type: boolean
        next_action:
          type: string
          enum:
            - pass
            - partial_rewrite
            - full_rewrite
            - human_review_required
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - issue_key
              - message
            properties:
              issue_key:
                type: string
              message:
                type: string
        rewrite_brief:
          type: array
          items:
            type: string

  style_draft:
    # 2026-09-09 样例优先（Step 1）：原文样例升为主信号——系统提示把 [风格样例] 排在硬禁令之后、
    # 抽象块之前，明令「以这位作者的手笔写本场：学用词、意象取向、句式与停顿、叙述姿态、对白处理」，
    # 删除「只学句法节奏、不学措辞意象」的限制；抄袭红线不变（不得复用原句 / 人物 / 事件）。
    # 输入预算 24000 → 64000：默认强度约 2 万字、满强度约 3 万字原文样例进入系统提示。
    # 2026-09 风格模仿 v2（W5）：删除已退役的 Style Feature Contract 七维与 Longform /
    # Chapter Story Architecture 引用；事实骨架约束放宽为「事实 / 因果 / 结局功能 / 必含项不变，
    # 句序 / 停顿 / 信息释放顺序 / 段落取舍可按参考机制重排」（既有 must-include / forbidden / ending 守卫不变）。
    # 2026-09-12 风格直起（Step 2）v10：来源稿标签为「First Draft (already in the reference
    # author's hand)」时改为定稿式复读——保留已像的段落，只把仍偏中性 / 偏解释 / 偏房风的段落
    # 再向样例靠一层，不从空白页重组、不中性化；蓝图要素的「怎么落纸」由参考手法决定；
    # 长度用作者自己的扩缩手段。来源稿为「Approved Neutral Draft」时行为不变（对照组）。
    # 2026-09-14 保真修补 v11：系统提示不再说「长度带是硬约束 / never imitate their length」——它与同一
    # 请求里的长度指导（作者尺度优先）矛盾；改为工作范围 + 硬范围，样例长度不是目标长度。偏好画像
    # 只在不与作者手法冲突时服从。
    version: "2026-09-22.v12"
    input_token_budget: 96000
    system_prompt: |
      You are refining a novel scene in the hand of one specific reference author. That author is the only style authority. Preserve bundle facts exactly and keep continuity safe.
      A [STYLE_REFERENCE] block may be prepended to this system prompt, and the author's own passages come as a [风格样例] block at the end of the user message, right before you write. Read them in this priority order, higher first:
      1. [风格样例] — the reference author's own passages, the primary signal: make the scene read as if that author wrote it — their diction and pet phrases, their images and comparisons, their sentence shapes and pauses, their narratorial stance and asides, how they place and tag dialogue, how they move between action, perception and interiority. Be bold: prefer the choice the samples would make over a plainer one. The book's own characters, places, names and events replace the samples'; never copy a sample sentence.
      2. [声音特征] and [正向风格特征] — voice habits and craft mechanisms distilled from the whole book; use them to check that your prose sounds like the samples.
      3. [禁忌模式] — things this author does not do; avoid them.
      4. [风格分布指导] — a soft description of the reference corpus, never a quota.
      5. 严格禁止 — the content red line: never reuse the samples' characters, places, names, events or whole sentences.
      If no [STYLE_REFERENCE] block is present, there is no style reference: perform a natural de-neutralizing rewrite of the source draft with concrete, unforced prose, and do not invent a target author or imitate any known writer.
      Return the complete rewritten scene, never a synopsis, excerpt, outline, or sample-sized fragment.
      The Scene Card target length band is the working range: stay inside the hard range the length guide states; inside it, the reference author's own scale wins, and a sample's length is never the target length.
    task_prompt: |
      The source draft below is labeled either "Approved Neutral Draft" or "First Draft (already in the reference author's hand)". The label decides your task; the reference author's passages are in the [风格样例] block at the end of this message.
      If the source is an Approved Neutral Draft: recompose it in the reference author's hand without changing factual continuity. Keep every fact, causal step, ending function, must-include item, character identity, and POV; sentence order, pause placement, information-release order, and paragraph selection may be rearranged when the reference mechanisms call for it. Do not add new events and do not change what the ending accomplishes. Do not line-edit the source: rebuild the prose from a blank page while preserving names, chronology, required objects, and causal steps. Its wording, sentence shapes, paragraphing, and level of explanation are non-authoritative. Where the source spells out a motive or a feeling that the reference author would leave implicit, leave it implicit; where the source narrates flatly what the reference author would render through perception, gesture or an aside, render it that way.
      If the source is a First Draft already in the reference author's hand: it was written from the same samples, so keep every passage that already sounds like the author and do not recompose from a blank page. Rewrite every passage that is still more neutral, more explanatory, more evenly paced, more decorated, or more generic than the samples, and move each of them all the way to the author's manner — their diction, their sentence shapes and pauses, their way of opening and closing, their handling of summary, interiority and dialogue. Apply any listed hard_qc rewrite brief exactly. Never wash the voice back toward a neutral register, and never trade the author's manner for the blueprint's.
      Cover every must-include constraint explicitly and stay inside the target length band. If the source draft is too short, expand with this author's own means — summary, digression, dialogue, description, reflection, or existing action-reaction beats; do not add a new plot event.
      Preserve the Scene Literary Blueprint v2 pressure: visible_desire, forced_choice, price_paid, information_release, relationship_turn, image_anchor, ending_action, and next_scene_pull must remain legible in prose, realized in the reference author's manner; where a blueprint field prescribes a manner this author would not use (an ending action, a fresh image, an anti-summary rule), the manner wins and the fact of the field stays.
      If a Style Reference — Narrative Mechanisms section is present, let it decide what is revealed first, where the scene pauses, how much is disclosed, and how time moves inside the scene.
      If an Author Preference Profile section is present, obey it only where it does not conflict with the reference author's manner.
      If Character Pressure Blueprint is present, preserve its hidden fear, wrong belief, shame point, avoidance strategy, relationship debt, and current mask as scene pressure, rendered the way this author renders pressure.
      If a Previous Scene Memory section is present, take facts, positions, objects and unfinished threads from it; it is not a voice to continue — the voice is the reference author's.
      Never violate a [禁忌模式] or 严格禁止 item; treat Style Drift Calibration lines as directional corrections, not text to copy.
      If a block headed 风格分布指导 is present, treat it as a soft description of the reference corpus rather than a quota; never add punctuation, filler, or arbitrary line breaks merely to resemble a statistic.
      If the Literary Freshness Budget marks preserve_reference_repetition, keep the deliberate cadence of the reference instead of flattening it.
      Remove only accidental runs of identical sentence templates and information the characters would not tell each other; every other question of taste — narrative distance, a reflective or summarising close, a returning image, an even pace, a named feeling — is settled by what the [风格样例] do.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - scene_text
      properties:
        scene_text:
          type: string
        style_notes:
          type: array
          items:
            type: string

  style_length_patch:
    # 2026-09-14 保真修补 v4：有绑定时补丁带 [STYLE_REFERENCE]（scene_generation._run_de_template_pass），
    # new_text 以作者手笔扩缩，不用房风的「加动作反应 / 删修饰」。
    version: "2026-09-22.v5"
    input_token_budget: 96000
    system_prompt: |
      If a [STYLE_REFERENCE] block is prepended to this system prompt and a [风格样例] block ends the user message, the reference author is the style authority: every new_text is written in that author's hand and expands or compresses with that author's own means as the samples show (summary, digression, dialogue, description, reflection), never with generic action-reaction filler; never reuse the samples' sentences, names, or events.
      You produce exact, minimal, segment-addressed edits for a Chinese novel scene whose reusable style and facts
      are already correct but whose visible-character count is outside a hard range. The labeled source contains
      synthetic segment markers such as ⟦S001⟧; those markers are addresses, not prose. Never rewrite, summarize,
      continue, or return the whole scene. Return only an allowed segment_id and its new_text. Preserve all required
      facts, chronology, names, POV, and the ending function. The caller will locate, apply, and validate every edit
      deterministically; you never need to copy source text as an address.
    task_prompt: |
      Return 1-6 edits using only segment IDs explicitly listed as editable in the dynamic contract. Never use the
      protected ending segment. For expansion, the caller preserves the selected segment and inserts new_text
      immediately after it; new_text must add concrete action-reaction, blocking, perception, or consequence in the
      same event. For compression, new_text replaces only the selected segment and must be shorter, deleting only
      repetition or decorative description while keeping adjacent prose grammatical. Use each segment_id at most
      once. Make the combined visible-character delta land inside the stated correction window. Do not put segment
      markers, ellipses, or placeholders in new_text. Do not include scene_text, copied source text, or commentary.
      If a [STYLE_REFERENCE] block is prepended to this system prompt, it is the style authority: every new_text is
      written in that reference author's hand, and it expands or compresses with that author's own means as the
      [风格样例] show (summary, digression, dialogue, description, reflection) rather than generic action-reaction
      filler; never reuse the samples' sentences, names, or events.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - edits
      properties:
        edits:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required:
              - segment_id
              - new_text
            properties:
              segment_id:
                type: string
                pattern: "^S[0-9]{3}$"
              new_text:
                type: string
                maxLength: 1000

  style_salvage_patch:
    # 2026-09-14 保真修补 v2：有 [STYLE_REFERENCE] 时替换段以作者手笔写、用作者自己的手段扩写。
    version: "2026-09-22.v3"
    input_token_budget: 96000
    system_prompt: |
      If a [STYLE_REFERENCE] block is prepended to this system prompt and a [风格样例] block ends the user message, the reference author is the style authority: write the replacement segment in that author's hand and reach the window with that author's own means as the samples show, never with generic action-reaction filler; never reuse the samples' sentences, names, or events.
      You perform one bounded, segment-addressed style salvage on an already approved Chinese novel scene after a
      complete style rewrite was rejected as extremely underlength. The labeled source contains synthetic markers
      such as ⟦S001⟧; they are addresses, not prose. Preserve the unselected source verbatim and never touch the
      protected ending segment. Rewrite exactly one allowed middle segment so it expresses the supplied reusable
      style mechanisms while preserving every fact, name, causal step, chronology, POV, and scene function.
    task_prompt: |
      Return exactly one edit with an allowed segment_id and replacement new_text. Keep new_text within the stated
      visible-character window for that segment. Do not summarize the whole scene, move events between segments,
      introduce new facts, quote reference prose, or include segment markers, ellipses, placeholders, copied source
      text, scene_text, or commentary. The caller will apply the replacement and validate facts, length, integrity,
      substantive change, and frozen-profile conformance deterministically.
      If a [STYLE_REFERENCE] block is prepended to this system prompt, write the replacement segment in that
      reference author's hand and reach the window with that author's own means as the [风格样例] show, never with
      generic action-reaction filler; never reuse the samples' sentences, names, or events.
    structured_schema:
      type: object
      additionalProperties: false
      required:
        - edits
      properties:
        edits:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - segment_id
              - new_text
            properties:
              segment_id:
