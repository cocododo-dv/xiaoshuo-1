# 模型路由的默认值只有一个来源：节点注册表（backend/src/novel_system/services/llm_node_registry.py 的 spec）。
# 2026-09-30 重评 R4 删掉了这里逐字段抄了一份的 task_routing：没有 models 快照、API 配置来自环境变量时
# 每个节点的路由取注册表默认值；作者在「设置 → AI 模型」保存的快照只记每个节点选的服务与模型，其余参数
# （温度、输出预算……）解析时取 spec——改默认值只改 spec 一处，已配置过的安装随发布生效。
# 这份文件只剩设置页不编辑的两段运行参数；库里的 models 快照带了同名键时以快照为准。

retry_budget:
  # 每场景真实 provider HTTP dispatch 的独立硬上限；内部 retry/degrade
  # 仍须逐次过闸，不能把理论重试数当作可消费额度。
  provider_attempt_budget: 32

job_runtime:
  # 幂等租约须覆盖最长的同步操作：LLM 场景 run（Best-of-N 最多 9 次生成 + 多轮 QC）
  # 常态 3-10 分钟。90s 会让客户端重试把仍在执行的 run 当过期回收 → 并发二次执行。
  idempotency_claim_ttl_seconds: 600
  heartbeat_interval_seconds: 45
