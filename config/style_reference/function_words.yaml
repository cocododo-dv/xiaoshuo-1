# Style Reference v2 声音签名——闭类词表(voice_signature.py 消费)。
# 依据 docs/style-imitation-v2-plan-2026-09-05.md §2.W3:声音签名只用闭类词与标点,
# 不含名词 / 动词等实词,天然内容安全,可以直接渲染进生成提示而不泄露原文。
#
# 约束:
#   * `groups` 下 8 组的词**互不重复**(测试守卫);一个词只归一组,
#     组密度 fw_<group>_per_1k 之间不重复计数。
#   * 嵌套词(如「但」⊂「但是」、「么」⊂「什么」)由 voice_signature 做**独占计数**:
#     长词命中的位置不再记入其子串短词。因此像「其实 / 其他 / 现在 / 偶尔」这类
#     现代复合词被有意放进词表,用来把「其 / 在 / 尔」等文言单字从现代用法中剥离。
#   * `sentence_final` / `person` / `speech_verbs` 是独立检测用的辅助词表,
#     允许与 `groups` 重叠。
version: 1

groups:
  particle:
    label: 结构助词
    words: [的, 地, 得, 所, 似的]
  aspect:
