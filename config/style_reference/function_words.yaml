# 句末助词分布:只看句子(按句末标点切分)最后一个可见字。
sentence_final:
  modal: [吧, 呢, 啊, 嗯, 哦, 呀, 罢, 嘞, 么, 吗, 嘛, 哩, 咧, 啦, 哟, 呗, 喽]
  classical: [也, 矣, 焉, 哉, 耶, 欤, 乎, 耳]

# 人称占比:三组代词的独占计数占三组总和的比例(词必须同时出现在 groups.pronoun)。
person:
  first: [我, 我们, 咱, 咱们, 俺, 俺们, 吾]
  second: [你, 你们, 您, 汝, 尔]
  third: [他, 她, 它, 他们, 她们, 它们, 伊, 彼]

# 对白引导动词。`main` 五类直接成为特征 speech_verb_<key>_share;
# 其余命中记入 other。以「道」结尾的复合词(笑道 / 问道 / 答道)归「道」一脉,
# 以「说」结尾的复合词(接着说 / 笑着说)归「说」;`exclusions` 先从引导子句里剥离,
# 避免「知道 / 小说」被当成引导动词。
speech_verbs:
  main:
    shuodao: [说道]
    shuo: [说]
    dao: [道]
    wen: [问]
    da: [答]
  other:
    - 叫
    - 喊
    - 嚷
    - 笑
    - 骂
    - 哭
    - 应
    - 吼
    - 念
    - 唱
    - 呼
    - 唤
    - 劝
    - 嘱
    - 叹
    - 讲
    - 告诉
    - 回答
    - 反问
    - 追问
    - 插嘴
    - 接口
    - 嘟囔
    - 咕哝
    - 喃喃
    - 低声
    - 大声
    - 高声
    - 冷冷
    - 心想
    - 暗想
  exclusions:
    - 知道
    - 道路
    - 道理
    - 道歉
    - 道士
    - 道德
    - 道谢
    - 小说
    - 传说
    - 据说
    - 学说
    - 问题
    - 学问
    - 答案
    - 报答
    - 应该
    - 应当
    - 反应
