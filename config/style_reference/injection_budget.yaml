# Style Reference 注入预算(injection.py 消费;单位一律是**字符数**,键名沿用
# *_max_tokens 仅为配置兼容:汉字 ~1 字 = 1 token 的粗估)。
#
# 2026-09 风格模仿 v2(W4,规格 §1.4 / §1.5):四种策略(A / B / C / MIXED)共用一套
# intensity 语义——intensity∈[0,100] 同时控制
#   ① 抽象四块(metric + voice + positive + forbidden)的总额
#      total(i) = intensity_min_total_chars + (system_prompt_max_tokens - intensity_min_total_chars) × i / 100
#   ② few-shot 样例窗口数 k(i) = round(few_shot_k_min + (few_shot_k - few_shot_k_min) × i / 100)
# 总额再按下面四个 ratio 切给四块;截断只在整行边界(_truncate_lines),预算不够时
# 宁可少一整行,不发半句。A 策略不含样例但同样按 total 截断;C 不带 few-shot(与 RAG 互斥)。
system_prompt_max_tokens: 2400        # intensity=100 时抽象四块总额
intensity_min_total_chars: 900        # intensity=0 时抽象四块总额;中间线性
# 2026-08 风格分布校准:量化画像只提供粗粒度倾向与相对调整方向,禁止把精确计数
# 暴露给生成器;精确数字仅供隐藏评测 / 候选审计 / 验证。四项严格合计 1.0。
positive_block_ratio: 0.45
forbidden_block_ratio: 0.20
metric_anchor_block_ratio: 0.15
voice_block_ratio: 0.20               # [声音特征](profile_json.voice_signature.habits)
metric_guidance_mode: soft_distribution
metric_guidance_max_items: 6

# few-shot 样例(B / MIXED):以 quote 所在段为中心的**连续段落窗口**(1–3 段,含对白
# 与叙述的往返),按 (场景段型匹配, 辨识度, 窗口完整度, 稳定次序) 选段,同一段型可多条。
# few_shot_k / few_shot_k_min:intensity=100 / 0 时的窗口数,中间线性取整
# few_shot_window_paragraphs:单个窗口最多几段(相邻、paragraph_index 连续,不跨缺口)
# few_shot_window_max_chars:单窗口原文上限;few_shot_paragraph_max_chars:单段上限
#   (超长段在句边界截断并加省略号)
# few_shot_block_max_chars:整个 [风格样例] 块上限(按整窗口装入,装不下的窗口整只丢弃;
#   该块在四块 ratio 之外,随样例必附反抄袭红线段)
# few_shot_quote_max_chars / few_shot_paragraph_min_chars / few_shot_candidate_scan_per_type:
#   旧键保留——无父段落的旧数据退化为短引文;每种段型最多扫描的候选 quote 数
few_shot_k: 6
few_shot_k_min: 2
few_shot_block_max_chars: 3600
few_shot_window_paragraphs: 3
few_shot_window_max_chars: 900
few_shot_paragraph_max_chars: 700
few_shot_paragraph_min_chars: 40
few_shot_quote_max_chars: 120
few_shot_candidate_scan_per_type: 12

# 多层叠加(scene > character > project > global):抽象总额 ×(1 + layered_total_scale_per_layer
# × (层数 - 1)),上限 × layered_total_scale_max;按权重 [1..n] 切给各层(越具体越多)。
# few-shot / RAG 样例只取最具体层,不再丢弃;同一 profile 跨作用域只渲染一次。
layered_total_scale_per_layer: 0.35
layered_total_scale_max: 1.7

# 跨场景一致性(W5 / W6 消费):上一场成稿尾部作 [前文声音锚] 的字数上限;
# [漂移校准] 行数上限。
continuity_anchor_max_chars: 900
drift_calibration_max_lines: 3

# 立项 C — Strategy C(RAG)三粒度内容克制风格召回预算。
# ANN 只索引句段形状/标点/虚词等风格签名,不索引原文题材词;候选池再按连续
# 风格距离确定性重排。内容二元组重叠只施加负向惩罚,绝不增加召回分。
# v2:query 默认是「画像代表签名」(画像 scene_samples 段落签名均值)+ 场景段型软过滤;
# 只有调用方显式标记前文已风格化(styled_context)时才用前文签名。
# snippet 最终仍引用参考书原文,故注入时红线段必随注并按下列上限截断。
rag_top_k: 3                  # 每粒度(sentence/paragraph/scene)向量召回条数
rag_inject_max: 5             # 合并去重后注入到 prompt 的总条数上限
rag_quote_max_chars: 100      # 单条样例截断(防注入大段原文)
rag_block_max_chars: 600      # 整个 [风格检索样例] block 上限
rag_scene_target_chars: 600   # scene 粒度:连续段落累加到该字数封一块
rag_min_sentence_chars: 8     # 过短句(标点/语气词)不入 sentence 索引
rag_min_paragraph_chars: 8    # 过短段不入 paragraph 索引
rag_context_query_max_chars: 2000  # 续写防漂移:取最近 N 字作检索 query
rag_signature_candidate_pool_min: 24       # ANN shortlist 最少候选数
rag_signature_candidate_pool_multiplier: 8 # shortlist = max(top_k×此值,最少候选数)
rag_paragraph_query_chars: 400              # 无显式换段时 paragraph query 取末尾字数
rag_style_min_score: 0.45                   # 低于此 [0,1] 最终风格分不注入
rag_content_overlap_penalty_threshold: 0.18 # 内容二元组 Jaccard 超此值开始负向惩罚
rag_content_overlap_penalty_max: 0.25       # 内容重叠最多折损 25%,不能正向加分
# 粒度权重(签名特征已归一,权重仅微调 "更完整肌理优先")
rag_weight_sentence: 1.0
rag_weight_paragraph: 1.1
rag_weight_scene: 1.15
