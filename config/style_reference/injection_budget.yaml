# Style Reference 注入预算(单位一律是**字符数**)。
#
# 2026-09-23 风格参考 v3(docs/style-reference-v3-2026-09-23.md,J10):强度滑块、四块比例、样例块总上限、
# 多层放大、量化指导等 30 个键随旧渲染一起删掉。现在:
# - 样例窗数是绑定配置的 sample_windows(默认 12;评审节点 4、规划节点 3),窗口本身由持久化窗口表切好
#   (≤60 段 / ≤4,000 字,不跨章题与场界);
# - 文风卡整张一个预算(整行截断,永不截半句);
# - 小上下文模型装不下时按整窗、整句贪心地去(inject/fit.py),红线从不截断。
# sample_window_max_chars:单窗正文上限(短尾窗并入时可放宽 25%;超长的单段窗在句边界截断)
# card_budget_chars:文风卡(或旧画像的卡替身)的总预算
sample_window_max_chars: 5000
card_budget_chars: 2600

# 2026-09-12 风格直起(Step 2,docs/history/style/style-first-draft-plan-2026-09-12.md):
# draft_mode_default:绑定 config_json 未写 draft_mode 时的起草方式——
#   style_first  = 有绑定时第一稿直接以参考作者手笔从 bundle 写(中性步位换内容,步位不变),
#                  style_draft 改为再靠近一层的复读;下游房风门(去模板 / 自动批评 / 近终稿
#                  确定性门 / 成稿文学阈值 / 新鲜度词表)整体让位,只留事实 / 抄袭 / 必含 / 禁止门
#   neutral_first = 现状:中性稿再上风格(阅读对照组)
# 生效值在 bundle 构建时冻结进运行时契约顶层 draft_mode;旧契约缺键 → neutral_first。
# style_first_length_slack:style_first 下场景卡数字长度带两侧各放宽的比例(0.5:1200–1800
#   → 600–2700),作者自己的场景尺度优先于系统的长度带;越界才触发长度补丁。
draft_mode_default: style_first
style_first_length_slack: 0.5
# 2026-09-22 结构跟随参考书:style_first 下按参考作者的章长中位 ÷ 本章场数推算「这位作者的一场
# 多长」(有显式场界的书直接用场长中位),硬范围上限至少抬到它 × (1 + slack),长度指引把它说成写作
# 目标;这个键是推算值的上限(字),防止只有 1–2 场的章把一场推成万字。
style_first_reference_scene_chars_max: 5000

# 2026-09-23 风格参考 v3(P5b,L1 / N6 / V7):风格步与软补丁的「像不像」阈值(style_step.fidelity_thresholds 读)。
# 2026-09-24 用作者的真实路由在 3 场 × 3 臂上核过(契约 docs/style-reference-v3-2026-09-23.md §7「上线与 A/B」):风格步 6 次决定全对,保持这些值。
# style_step_max_percentile:首稿读数的百分位 ≤ 它、且「重点」维没有越界 → 风格步不调模型,首稿即风格稿
#   (真实参考书上随机 30 段原文九成 ≤ 90);否则做定向修改。
# revision_min_improvement:定向修改稿的 distance 至少比首稿小这么多才采用,否则保留首稿(永不越改越远)。
# patch_max_distance_increase:软补丁的成对比较打平(或比不成)时的退路——distance 变大超过它就退回补丁前的稿子。
# 2026-10-14 评审统一(style_reference/judge.py):退回 judge_tolerance(两次绝对评审分相减,噪声就能翻转),
#   补丁留不留、定向修改用不用改成成对比较(两个次序各问一次,一致才算数);放行由代码按作数的分判:
# judge_pass_score:校准后的分(0 = 普通文字,10 = 作者原文)低于它的维要补(至多 4 维,重点维在前)。
# judge_raw_pass_score:没校准(从没校准 / 评审模型换过 / 画像重学过 / 上次校准失败)时按模型原始分判的线,
#   与旧提示词「每维 ≥7 放行」同一条。
# judge_min_separation:校准时作者原文与它们的普通改写,平均分至少差这么多(原始 10 分制)评审才算分得清;
#   差不到 → 评审「不可用」,它的分不据以补丁、不据以退回。
# judge_min_dimension_separation:某一维至少差这么多,这一维的分才作数。
# judge_calibration_anchors:校准用几段原文(各配一段普通改写;调用数 = 3 × 它)。
fidelity:
  style_step_max_percentile: 90
  revision_min_improvement: 0.03
  patch_max_distance_increase: 0.05
  judge_pass_score: 6.0
  judge_raw_pass_score: 7.0
  judge_min_separation: 2.0
  judge_min_dimension_separation: 1.0
  judge_calibration_anchors: 3

# 跨场景连续性(bundle_builder.load_continuity_budget):上一场成稿尾部作 [前文声音锚] 的字数上限
# (只在 neutral_first / 无绑定时进 bundle;style_first 下作者自己的稿子不当声音参照)。
continuity_anchor_max_chars: 900
