# 模型单价（成本看板用）
#
# 成本看板以 token 为主。只有在这里写了单价的模型才折算金额；没写的模型在看板上标「未定价」，
# 不用占位估算价编一个数（2026-09-30 起；以前这里的两条 gpt-5 占位价与 default_estimate 兜底价已删）。
#
# 每一条：
#   provider       调用记录里的服务类型；经中转接入的一般是 openai_compatible
#   model          发给服务的模型 id（与 设置 · AI 模型 里选的一致）
#   input_per_1k   输入每 1000 token 的单价
#   output_per_1k  输出每 1000 token 的单价
#   effective_at   可选，起生效时间（UTC ISO）；同一模型可写多条，按调用时间取当时生效的那条
# 整本价书一个币种（currency）；写了别的币种的条目不参与折算。改完保存即生效，不用重启后端。
#
# 例：
#   prices:
#     - provider: openai_compatible
#       model: your-model-id
#       effective_at: "2026-01-01T00:00:00Z"
#       input_per_1k: 0.003
#       output_per_1k: 0.015

version: 2
currency: USD
prices: []
