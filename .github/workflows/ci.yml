name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

# A newer push to the same pull request supersedes the running checks (B12-22). Push runs get one
# group per commit: a group holds one running and one pending run and cancels the older pending run
# when a newer one queues, so a per-branch group would queue pushes to main behind each other and
# report an intermediate commit as cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-quality:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # This checkout's backend/src: the locks are installed without the project itself, and
    # the backend/novel_system import shim is gone (B12-08).
    env:
      PYTHONPATH: src
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Verify backend dependency graph
        run: python -m pip check

      - name: Run backend correctness lint
        run: python -m ruff check src tests

      - name: Audit backend dependencies
        run: python -m pip_audit -r requirements.lock --disable-pip --require-hashes

      - name: Verify service architecture boundaries
        run: python -m pytest -q tests/test_service_architecture.py tests/test_dependency_lock.py

  backend-tests:
    name: Backend Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # This checkout's backend/src: the locks are installed without the project itself, and
    # the backend/novel_system import shim is gone (B12-08).
    env:
      PYTHONPATH: src
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run backend shard
        run: >-
          python scripts/pytest_shard.py
          --shard-index "${{ matrix.shard }}"
          --shard-count 4
          --
          -q
          --junitxml=".test-results/backend-shard-${{ matrix.shard }}.xml"

      - name: Upload backend shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ matrix.shard }}-junit
          path: backend/.test-results/backend-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-react:
    name: Frontend Tests (React mainline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

      # rules-of-hooks errors fail the job; exhaustive-deps warnings are printed but do not fail it (owner decision #26b)
      - name: Lint React hooks (ESLint)
        run: npm run lint

      - name: Run React unit tests (vitest)
        run: npm test

      - name: Build React frontend
        run: npm run build

  frontend-react-contract-e2e:
    name: React Contract E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install frontend dependencies
        run: npm ci --prefix frontend-react

      - name: Install Chromium
        working-directory: frontend-react
        run: npx playwright install --with-deps chromium

      - name: Run isolated React-to-backend contract E2E
        run: bash scripts/verify_react_e2e.sh
