name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  backend-quality:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # This checkout's backend/src: the locks are installed without the project itself, and
    # the backend/novel_system import shim is gone (B12-08).
    env:
      PYTHONPATH: src
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Verify backend dependency graph
        run: python -m pip check

      - name: Run backend correctness lint
        run: python -m ruff check src tests

      - name: Audit backend dependencies
        run: python -m pip_audit -r requirements.lock --disable-pip --require-hashes

      - name: Verify service architecture boundaries
        run: python -m pytest -q tests/test_service_architecture.py tests/test_dependency_lock.py

  backend-tests:
    name: Backend Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # This checkout's backend/src: the locks are installed without the project itself, and
    # the backend/novel_system import shim is gone (B12-08).
    env:
      PYTHONPATH: src
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Run backend non-Chroma shard
        run: >-
          python scripts/pytest_shard.py
          --shard-index "${{ matrix.shard }}"
          --shard-count 4
          --
          -q
          -m "not chroma_integration"
          --junitxml=".test-results/backend-shard-${{ matrix.shard }}.xml"

      - name: Upload backend shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ matrix.shard }}-junit
          path: backend/.test-results/backend-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn
          retention-days: 7

  backend-chroma:
    name: Backend Chroma Integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # This checkout's backend/src: the locks are installed without the project itself, and
    # the backend/novel_system import shim is gone (B12-08).
    env:
      PYTHONPATH: src
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend with locked Chroma dependencies
        run: python -m pip install --require-hashes -r requirements-chroma.lock

      - name: Run Chroma runtime smoke check
        run: python -m novel_system.tools.chroma_smoke

      - name: Run Chroma integration tests
        run: >-
          python -m pytest -q -m "chroma_integration"
          --junitxml=".test-results/backend-chroma.xml"

      - name: Upload Chroma result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-chroma-junit
          path: backend/.test-results/backend-chroma.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-react:
    name: Frontend Tests (React mainline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Run React unit tests (vitest)
        run: npm test

      - name: Build React frontend
        run: npm run build

  frontend-react-contract-e2e:
    name: React Contract E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install frontend dependencies
        run: npm ci --prefix frontend-react

      - name: Install Chromium
        working-directory: frontend-react
        run: npx playwright install --with-deps chromium

      - name: Run isolated React-to-backend contract E2E
        run: bash scripts/verify_react_e2e.sh
